<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Perché l'AI non ti serve (se non hai questo prima)</title>
  <meta name="description" content="Scopri perché l'AI non ti sta liberando tempo e cosa devi sistemare prima di aggiungere altri prompt, tool o automazioni." />
  <style>
    :root {
      --bg: #0f1115;
      --panel: #161a21;
      --panel-2: #1b2029;
      --text: #ffffff;
      --muted: #b9c0cc;
      --line: rgba(255,255,255,.1);
      --accent: #f2b84b;
      --accent-2: #f59e0b;
      --shadow: 0 24px 70px rgba(0,0,0,.35);
      --radius: 24px;
      --max: 1100px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top, rgba(242,184,75,.12), transparent 30%),
        linear-gradient(180deg, #0e1014 0%, #12161d 100%);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
    }

    .wrap {
      width: min(var(--max), calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0 64px;
    }

    .hero {
      text-align: center;
      margin: 0 auto 32px;
      max-width: 980px;
    }

    .eyebrow {
      display: inline-block;
      padding: 8px 14px;
      border: 1px solid rgba(242,184,75,.35);
      background: rgba(242,184,75,.08);
      border-radius: 999px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    .title-3 {
      margin: 0;
      line-height: 1.02;
      letter-spacing: -.03em;
      font-weight: 900;
      font-size: clamp(2rem, 4vw, 4.2rem);
    }

    .title-3 .line {
      display: block;
    }

    .line-1 { color: #ffffff; }
    .line-2 { color: var(--accent); margin-top: 8px; }

    .section-tag {
      display: inline-block;
      padding: 6px 12px;
      border: 1px solid rgba(242,184,75,.35);
      background: rgba(242,184,75,.08);
      border-radius: 999px;
      color: var(--accent);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .step-section {
      background: linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02));
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px;
      max-width: 980px;
      margin: 0 auto 24px;
    }

    .step-header {
      text-align: center;
      margin-bottom: 20px;
    }

    .step-content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      align-items: center;
    }

    @media (max-width: 640px) {
      .step-content {
        grid-template-columns: 1fr;
      }
    }

    .workbook-img {
      width: 100%;
      max-height: 280px;
      object-fit: contain;
      border-radius: 12px;
    }

    .download-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    .video-card {
      background: linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02));
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px;
      max-width: 980px;
      margin: 0 auto;
    }

    .video-shell {
      overflow: hidden;
      border-radius: 18px;
      background: #000;
      aspect-ratio: 16 / 9;
      position: relative;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.04);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    .status-box {
      margin-top: 18px;
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px 20px;
      text-align: center;
    }

    .status-label {
      color: var(--muted);
      font-size: .95rem;
      margin-bottom: 8px;
    }

    .countdown {
      font-size: clamp(1.2rem, 2vw, 1.6rem);
      font-weight: 800;
      letter-spacing: -.02em;
    }

    .cta-wrap {
      margin-top: 22px;
      text-align: center;
      min-height: 74px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .cta-button {
      appearance: none;
      border: 0;
      border-radius: 999px;
      padding: 18px 30px;
      background: linear-gradient(180deg, var(--accent), var(--accent-2));
      color: #111111;
      font-size: 1rem;
      font-weight: 900;
      text-decoration: none;
      box-shadow: 0 16px 38px rgba(242,184,75,.24);
      transition: transform .18s ease, opacity .18s ease;
    }

    .cta-button:hover { transform: translateY(-2px); }

    .cta-hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px);
      visibility: hidden;
    }

    .cta-visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
      visibility: visible;
    }

    .tiny-note {
      margin-top: 14px;
      text-align: center;
      color: var(--muted);
      font-size: .88rem;
    }

    .footer {
      margin-top: 48px;
      text-align: center;
      color: var(--muted);
      font-size: .88rem;
      padding: 24px;
      border-top: 1px solid var(--line);
    }

    @media (max-width: 640px) {
      .wrap { padding-top: 22px; }
      .video-card { padding: 12px; }
      .step-section { padding: 16px; }
      .status-box { padding: 14px; }
      .cta-button { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <h1 class="title-3">
        <span class="line line-1">Perché l'AI non ti serve</span>
        <span class="line line-2">(se non hai questo prima)</span>
      </h1>
    </section>

    <section class="step-section">
      <div class="step-header">
        <div class="section-tag">Step 1</div>
      </div>
      <div class="step-content">
        <img src="/wspaints/assets/workbook.png" alt="Workbook Sistema o Caos - Framework RISSA 3D" class="workbook-img" />
        <div class="download-section">
          <a href="https://riccardoromano.biz/wbrissa" class="cta-button">Scarica il workbook</a>
        </div>
      </div>
    </section>

    <section class="step-section">
      <div class="step-header">
        <div class="section-tag">Step 2</div>
      </div>
      <div class="video-card" style="border: none; box-shadow: none; padding: 0;">
        <div class="video-shell">
          <iframe
            id="vimeo-player"
            src="https://player.vimeo.com/video/1200064325?badge=0&autopause=0&player_id=0&app_id=58479"
            allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media"
            title="Training video"
          ></iframe>
        </div>

        <div class="status-box" id="statusBox">
          <div class="countdown" id="countdown">Tempo rimanente: 01:00</div>
        </div>

        <div class="cta-wrap">
          <a
            id="ctaButton"
            class="cta-button cta-hidden"
            href="https://form.jotform.com/261314999423161"
            target="_blank"
            rel="noopener noreferrer"
          >Vai alla candidatura</a>
        </div>

        <div class="tiny-note">Il pulsante si sblocca dopo 1 minuto di visione del video.</div>
      </div>
    </section>
  </main>

  <footer class="footer">
    ©2026 Riccardo Romano. Tutti i diritti riservati.
  </footer>

  <script src="https://player.vimeo.com/api/player.js"></script>
  <script>
    const WATCH_SECONDS_REQUIRED = 60;
    const STORAGE_KEY = 'workshop-wspaints-watch-seconds-v1';
    const STORAGE_UNLOCK_KEY = 'workshop-wspaints-cta-unlocked-v1';

    const iframe = document.getElementById('vimeo-player');
    const player = new Vimeo.Player(iframe);
    const ctaButton = document.getElementById('ctaButton');
    const countdown = document.getElementById('countdown');

    let accumulatedWatchSeconds = Number(sessionStorage.getItem(STORAGE_KEY) || 0);
    let unlocked = sessionStorage.getItem(STORAGE_UNLOCK_KEY) === 'true';
    let lastSecondTracked = null;

    function formatSeconds(totalSeconds) {
      const safe = Math.max(0, Math.ceil(totalSeconds));
      const mins = String(Math.floor(safe / 60)).padStart(2, '0');
      const secs = String(safe % 60).padStart(2, '0');
      return `${mins}:${secs}`;
    }

    function revealCTA() {
      unlocked = true;
      sessionStorage.setItem(STORAGE_UNLOCK_KEY, 'true');
      ctaButton.classList.remove('cta-hidden');
      ctaButton.classList.add('cta-visible');
      countdown.textContent = 'Pulsante sbloccato';
    }

    function updateUI() {
      if (unlocked || accumulatedWatchSeconds >= WATCH_SECONDS_REQUIRED) {
        revealCTA();
        return;
      }
      const remaining = WATCH_SECONDS_REQUIRED - accumulatedWatchSeconds;
      countdown.textContent = `Tempo rimanente: ${formatSeconds(remaining)}`;
    }

    if (unlocked) {
      revealCTA();
    } else {
      updateUI();
    }

    player.on('timeupdate', (data) => {
      if (unlocked) return;

      const currentSecond = Math.floor(data.seconds);

      if (lastSecondTracked === null) {
        lastSecondTracked = currentSecond;
        return;
      }

      if (currentSecond !== lastSecondTracked) {
        const diff = currentSecond - lastSecondTracked;

        if (diff > 0 && diff <= 2) {
          accumulatedWatchSeconds += diff;
          sessionStorage.setItem(STORAGE_KEY, String(accumulatedWatchSeconds));
        }

        lastSecondTracked = currentSecond;
        updateUI();
      }
    });

    player.on('seeked', () => {
      lastSecondTracked = null;
    });

    player.on('play', async () => {
      if (lastSecondTracked === null) {
        try {
          const seconds = await player.getCurrentTime();
          lastSecondTracked = Math.floor(seconds);
        } catch (_) {}
      }
    });

    player.on('ended', () => {
      lastSecondTracked = null;
      updateUI();
    });
  </script>
</body>
</html>
