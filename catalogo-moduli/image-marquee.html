<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Marquee - Solo Immagini</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 0;
            overflow-x: hidden;
        }
        .marquee-container {
            width: 100%;
            overflow: hidden;
            position: relative;
        }
        /* Fade ai lati */
        .marquee-container::before,
        .marquee-container::after {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            width: 150px;
            z-index: 10;
            pointer-events: none;
        }
        .marquee-container::before {
            left: 0;
            background: linear-gradient(to right, #0a0a0a 0%, transparent 100%);
        }
        .marquee-container::after {
            right: 0;
            background: linear-gradient(to left, #0a0a0a 0%, transparent 100%);
        }
        .marquee-track {
            display: flex;
            gap: 30px;
            animation: marquee 30s linear infinite;
        }
        .marquee-track:hover {
            animation-play-state: paused;
        }
        .marquee-track.reverse {
            animation-direction: reverse;
        }
        @keyframes marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        .marquee-item {
            flex-shrink: 0;
            width: 500px;
            height: 425px;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            transition: transform 0.4s ease;
        }
        .marquee-item:hover {
            transform: scale(1.03);
        }
        .marquee-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }
        .marquee-item:hover img {
            transform: scale(1.1);
        }
        .marquee-caption {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 30px;
            background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, transparent 100%);
            transform: translateY(100%);
            transition: transform 0.4s ease;
        }
        .marquee-item:hover .marquee-caption {
            transform: translateY(0);
        }
        .marquee-caption h3 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #fff;
        }
        /* Controlli */
        .demo-controls {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 100;
        }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            background: rgba(228, 34, 83, 0.9);
            color: #fff;
            transition: all 0.3s;
        }
        .btn:hover { transform: scale(1.05); }
        .btn-secondary {
            background: rgba(255,255,255,0.1);
        }
        /* Responsive */
        @media (max-width: 768px) {
            .marquee-item {
                width: 300px;
                height: 255px;
            }
            .marquee-container::before,
            .marquee-container::after {
                width: 50px;
            }
        }
    </style>
</head>
<body>
    <div class="marquee-container">
        <div class="marquee-track" id="image-track">
            <div class="marquee-item">
                <img src="https://images.unsplash.com/photo-1460925895917-afdab827c52f?w=1000&h=850&fit=crop" alt="Strategia Marketing">
                <div class="marquee-caption">
                    <h3>Strategia Marketing</h3>
                </div>
            </div>
            <div class="marquee-item">
                <img src="https://images.unsplash.com/photo-1611162617474-5b21e879e113?w=1000&h=850&fit=crop" alt="Facebook Ads">
                <div class="marquee-caption">
                    <h3>Facebook Ads</h3>
                </div>
            </div>
            <div class="marquee-item">
                <img src="https://images.unsplash.com/photo-1573804633927-bfcbcd909cfe?w=1000&h=850&fit=crop" alt="Google Ads">
                <div class="marquee-caption">
                    <h3>Google Ads</h3>
                </div>
            </div>
            <div class="marquee-item">
                <img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=1000&h=850&fit=crop" alt="Sviluppo Web">
                <div class="marquee-caption">
                    <h3>Sviluppo Web</h3>
                </div>
            </div>
            <div class="marquee-item">
                <img src="https://images.unsplash.com/photo-1551434678-e076c223a692?w=1000&h=850&fit=crop" alt="Automazioni">
                <div class="marquee-caption">
                    <h3>Automazioni</h3>
                </div>
            </div>
            <!-- Duplicato per loop -->
            <div class="marquee-item">
                <img src="https://images.unsplash.com/photo-1460925895917-afdab827c52f?w=1000&h=850&fit=crop" alt="Strategia Marketing">
                <div class="marquee-caption">
                    <h3>Strategia Marketing</h3>
                </div>
            </div>
            <div class="marquee-item">
                <img src="https://images.unsplash.com/photo-1611162617474-5b21e879e113?w=1000&h=850&fit=crop" alt="Facebook Ads">
                <div class="marquee-caption">
                    <h3>Facebook Ads</h3>
                </div>
            </div>
            <div class="marquee-item">
                <img src="https://images.unsplash.com/photo-1573804633927-bfcbcd909cfe?w=1000&h=850&fit=crop" alt="Google Ads">
                <div class="marquee-caption">
                    <h3>Google Ads</h3>
                </div>
            </div>
            <div class="marquee-item">
                <img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=1000&h=850&fit=crop" alt="Sviluppo Web">
                <div class="marquee-caption">
                    <h3>Sviluppo Web</h3>
                </div>
            </div>
            <div class="marquee-item">
                <img src="https://images.unsplash.com/photo-1551434678-e076c223a692?w=1000&h=850&fit=crop" alt="Automazioni">
                <div class="marquee-caption">
                    <h3>Automazioni</h3>
                </div>
            </div>
        </div>
    </div>

    <div class="demo-controls">
        <button class="btn" onclick="toggleSpeed()">Cambia velocità</button>
        <button class="btn btn-secondary" onclick="toggleDirection()">Inverti direzione</button>
        <button class="btn btn-secondary" onclick="togglePause()">Pausa</button>
    </div>

    <script>
        const track = document.getElementById('image-track');
        let currentSpeed = 30;
        let isPaused = false;

        function toggleSpeed() {
            currentSpeed = currentSpeed === 30 ? 15 : currentSpeed === 15 ? 45 : 30;
            track.style.animationDuration = `${currentSpeed}s`;
        }

        function toggleDirection() {
            track.classList.toggle('reverse');
        }

        function togglePause() {
            isPaused = !isPaused;
            track.style.animationPlayState = isPaused ? 'paused' : 'running';
        }
    </script>
</body>
</html>
