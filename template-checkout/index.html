                                        gradient_stop_2 = this[style_for]['gradient_color_stop_2']+'%'
                                    }

                                    }else{
                                            background = `background: linear-gradient(${this[style_for]['gradient_color_1']} ${gradient_stop_1}, ${this[style_for]['gradient_color_2']} ${gradient_stop_2});`

                                if(this.productPrice && this.discount && this.discount.type == 'fixed' && this.productPrice > 0){
                                    return this.discount.price ? parseFloat(this.discount.price) : 0
                                }else if(this.productPrice && this.discount && this.discount.type == 'percentage' && this.productPrice > 0){
                                    if(this.productPrice && this.discount.percentage){

                        getCardType () {
                            let number = this.cardNumber;
                            let re = new RegExp("^4");
                            if (number.match(re) != null) return "visa";

                            re = new RegExp("^(34|37)");
                            if (number.match(re) != null) return "amex";

                            re = new RegExp("^5[1-5]");
                            if (number.match(re) != null) return "mastercard";

                            re = new RegExp("^6011");
                            if (number.match(re) != null) return "discover";
                            
                            re = new RegExp('^9792')
                            if (number.match(re) != null) return 'troy'

                            return "visa"; // default type

                        // If the next funnel step is external (URL contains mb_token=), re-resolve
                        // it server-side with the just-finalized customer so the token carries a
                        // real customer_id (enabling one-click upsell on the external upsell page).
                        async resolveExternalNextUrl() {
                            if (!this.nextPageUrl) return this.nextPageUrl;
                            try {
                                if (!/[?&]mb_token=/.test(this.nextPageUrl)) return this.nextPageUrl;
                                if (!this.sales_funnel_id || !this.funnel_step_id || !this.customer || !this.customer.unique_id) return this.nextPageUrl;
                                const res = await axios.post('/api/sale-page/get-next-page-success-no-url', {
                                    sales_funnel_id: this.sales_funnel_id,
                                    step_id: this.funnel_step_id,
                                    customer_unique_id: this.customer.unique_id,
                                });
                                if (res && res.data && res.data.status && res.data.data && res.data.data.next_success_url) {
                                    return res.data.data.next_success_url;
                                }
                            } catch (e) {}
                            return this.nextPageUrl;

                        /**
                         * Build the CSS custom-property map for the active palette.
                         * Mirror of the editor-side paletteVars() in OrderTemplate.vue so
                         * the live/preview renderer and the editor produce identical output.
                         * Direct keys -> --palette-<key>; derived tokens (hover/press/panel/
                         * input/text-mute/gradients) are built at render time via color-mix().
                         */
                        paletteVars() {
                            const p = (this.activePalette && this.activePalette.colors) || {}
                            const vars = {}
                            const direct = {
                                bg:         '--palette-bg',
                                bg_alt:     '--palette-bg-2',
                                text:       '--palette-text',
                                text_muted: '--palette-text-dim',
                                primary:    '--palette-primary',
                                secondary:  '--palette-secondary',
                                accent:     '--palette-accent',
                            }
                            for (const k in direct) {
                                if (p[k]) vars[direct[k]] = p[k]
                            }
                            if (p.primary) {
                                vars['--palette-primary-hover'] = `color-mix(in oklch, ${p.primary}, white 8%)`
                                vars['--palette-primary-press'] = `color-mix(in oklch, ${p.primary}, black 8%)`
                            }
                            if (p.bg) {
                                vars['--palette-panel']        = `color-mix(in oklch, ${p.bg}, white 6%)`
                                vars['--palette-panel-2']      = `color-mix(in oklch, ${p.bg}, white 10%)`
                                vars['--palette-input-bg']     = `color-mix(in oklch, ${p.bg}, black 8%)`
                                vars['--palette-input-border'] = `color-mix(in oklch, ${p.bg}, white 14%)`
                            }
                            if (p.text && p.bg) {
                                vars['--palette-text-mute'] = `color-mix(in oklch, ${p.text}, ${p.bg} 55%)`
                            }
                            if (p.primary && p.secondary) {
                                vars['--palette-gradient-section-text'] =
                                    `linear-gradient(90deg, ${p.primary}, ${p.secondary})`
                                vars['--palette-gradient-placeholder'] =
                                    `linear-gradient(135deg, color-mix(in oklch, ${p.primary}, ${p.bg || '#000'} 45%), color-mix(in oklch, ${p.secondary}, ${p.bg || '#000'} 45%))`
                            }
                            return vars
                        },

                                }else if(this.coupon.timer_type == 'evergreen'){
                                    var now = new Date();
                                    now.setHours(0,0,0,0);
                                    this.couponTimer.startDate = (Date.parse(now) / 1000);
                                    var endTime = new Date();
                                    var numberOfDaysToAdd = this.coupon.days ? this.coupon.days : 0;
                                    let hours=0;
                                    let minutes=0;
                                    if(this.coupon.hours && this.coupon.hours != '00'){
                                            hours=this.coupon.hours
                                    }
                                    if(this.coupon.minutes && this.coupon.minutes != '00'){
                                            minutes=this.coupon.minutes
                                    }
                                    endTime.setHours(hours,minutes,0,0);
                                    endTime.setDate(endTime.getDate() + numberOfDaysToAdd); 
                                    this.couponTimer.endDate = (Date.parse(endTime) / 1000);

                                    var now = new Date();
                                    now = (Date.parse(now) / 1000);

                            this.couponTimer.invertvalData = setInterval(() => {
                                if (--timer < 0) {
                                    timer = 0;
                                    this.couponTimer.days = '00'
                                    this.couponTimer.hours = '00'
                                    this.couponTimer.minutes = '00'
                                    this.couponTimer.seconds = '00'
                                    this.clearIntervalData()
                                } else {
                                    days = parseInt(timer / 60 / 60 / 24, 10);
                                    hours = parseInt((timer / 60 / 60) % 24, 10);
                                    minutes = parseInt((timer / 60) % 60, 10);
                                    seconds = parseInt(timer % 60, 10);
                                    days = days < 10 ? "0" + days : days;
                                    hours = hours < 10 ? "0" + hours : hours;
                                    minutes = minutes < 10 ? "0" + minutes : minutes;
                                    seconds = seconds < 10 ? "0" + seconds : seconds;
                                    this.couponTimer.days = days
                                    this.couponTimer.hours = hours
                                    this.couponTimer.minutes = minutes
                                    this.couponTimer.seconds = seconds
                                }
                            }, 1000);

                        this.flagCount = 0;

                            this.orderFormSetting.first_name &&
                            this.orderFormSetting.first_name.is_show &&
                            this.orderFormSetting.first_name.is_required &&
                            !this.customer.first_name
                        ) {
                            this.validation.first_name.is_required_error = true;
                            this.flagCount++;
                        } else {
                            this.validation.first_name.is_required_error = false;
                        }
                        if (
                            this.orderFormSetting.last_name &&
                            this.orderFormSetting.last_name.is_show &&
                            this.orderFormSetting.last_name.is_required &&
                            !this.customer.last_name
                        ) {
                            this.validation.last_name.is_required_error = true;
                            this.flagCount++;
                        } else {
                            this.validation.last_name.is_required_error = false;
                        }
                        if (
                            this.orderFormSetting.email &&
                            this.orderFormSetting.email.is_show &&
                            this.orderFormSetting.email.is_required &&
                            !this.customer.email
                        ) {
                            this.validation.email.is_required_error = true;
                            this.flagCount++;
                        } else {
                            this.validation.email.is_required_error = false;
                            if (!this.isEmail(this.customer.email)) {
                            this.validation.email.is_email_error = true;
                            this.flagCount++;
                            } else {
                            this.validation.email.is_email_error = false;
                            }
                        }

                        if (
                        this.orderFormSetting.phone &&
                        this.orderFormSetting.phone.is_show &&
                        this.orderFormSetting.phone.is_required &&
                        !this.customer.phone.trim()
                        ) {
                        this.phoneError = null
                        this.validation.phone.is_required_error = true;
                        this.flagCount++;
                        } else {
                        //Phone
                        if(this.phoneInput){
                            const PHONE_ERROR_MAP = [
                            "Invalid number",
                            "Invalid country code",
                            "Number too short",
                            "Number too long",
                            "Invalid number",
                            ]
                            var phoneNumber = this.customer.phone.trim()
                            const isValid = this.phoneInput.isValidNumber()
                            if(!isValid){
                            const errorCode = this.phoneInput.getValidationError()
                            if(errorCode){
                                this.validation.phone.is_required_error = false;
                                this.phoneError = PHONE_ERROR_MAP[errorCode] ?? 'Unexpected Format'
                                this.flagCount++;
                            }

                            this.phoneError = null
                            this.validation.phone.is_required_error = false;
                            }
                        }else{
                            this.phoneError = null
                            this.validation.phone.is_required_error = false;
                        }
                        }

                        if(this.orderFormSetting.show_shipping_on == 'tab2' && this.activeFormTab == 1){

                        setDiscountTimer() {
                            if (this.orderFormSetting.is_scarcity_trigger && this.scarcitySetting && this.discount) {
                                if(this.discount.timer_type == 'exact'){
                                    var now = new Date();
                                    now = this.convertTZ(now, this.discount.time_zone);
                                    this.discountTimer.startDate = (Date.parse(now) / 1000);
                                    var endTime = new Date(this.discount.expiration_date_time);
                                    this.discountTimer.endDate = (Date.parse(endTime) / 1000);
                                }else if(this.discount.timer_type == 'evergreen'){
                                    var now = new Date();
                                    now.setHours(0,0,0,0);
                                    this.discountTimer.startDate = (Date.parse(now) / 1000);
                                    var endTime = new Date();
                                    var numberOfDaysToAdd = this.discount.days ? this.discount.days : 0;
                                    let hours=0;
                                    let minutes=0;
                                    if(this.discount.hours && this.discount.hours != '00'){
                                            hours=this.discount.hours
                                    }
                                    if(this.discount.minutes && this.discount.minutes != '00'){
                                            minutes=this.discount.minutes
                                    }
                                    endTime.setHours(hours,minutes,0,0);
                                    endTime.setDate(endTime.getDate() + numberOfDaysToAdd); 
                                    this.discountTimer.endDate = (Date.parse(endTime) / 1000);
                                }else if(this.discount.timer_type == 'cookie'){
                                    var now = new Date();
                                    now = (Date.parse(now) / 1000);
                                    this.discountTimer.startDate = now;
                                    var cookieNewDiscountDate=localStorage.getItem("of-scarcity-discount-time-"+this.orderFormSetting.id+"-"+this.discount.id+"-"+this.stepData.id);
                                    var endTime = new Date();
                                    if(cookieNewDiscountDate){
                                        endTime = cookieNewDiscountDate;
                                    }else{
                                        endTime = new Date();
                                        var numberOfDaysToAdd = this.discount.days;
                                        endTime.setHours(this.discount.hours,this.discount.minutes,0,0);
                                        endTime.setDate(endTime.getDate() + numberOfDaysToAdd); 
                                        var newdate=new Date()
                                        newdate.setMinutes(newdate.getMinutes() + parseInt(this.discount.minutes));
                                        newdate.setHours(newdate.getHours() + parseInt(this.discount.hours));
                                        newdate.setDate(newdate.getDate() + parseInt(this.discount.days)); 
                                        localStorage.setItem("of-scarcity-discount-time-"+this.orderFormSetting.id+"-"+this.discount.id+"-"+this.stepData.id,newdate)
                                    }
                                    this.discountTimer.endDate = (Date.parse(endTime) / 1000);
                                }
                                this.setupDiscountTimer();
                            }
                        },
                        setupDiscountTimer() {
                            this.clearDiscountTimer()
                            let timer = this.discountTimer.endDate - this.discountTimer.startDate;
                            let minutes, seconds, days, hours;
                            this.discountTimer.invertvalData = setInterval(() => {
                                if (--timer < 0) {
                                    timer = 0;
                                    this.discountTimer.days = '00'
                                    this.discountTimer.hours = '00'
                                    this.discountTimer.minutes = '00'
                                    this.discountTimer.seconds = '00'
                                    this.clearDiscountTimer()
                                    if(this.discount.expiration_action == 'reset_timer'){
                                        this.setDiscountTimer()
                                    }else if (this.discount.expiration_action == 'hide_timer'){
                                        let timer_div=document.getElementsByClassName("timer-root");
                                        if(timer_div){
                                            timer_div[0].remove()
                                            localStorage.removeItem("of-scarcity-discount-time-"+this.orderFormSetting.id+"-"+this.discount.id+"-"+this.stepData.id);
                                        }
                                    }
                                } else {
                                    days = parseInt(timer / 60 / 60 / 24, 10);
                                    hours = parseInt((timer / 60 / 60) % 24, 10);
                                    minutes = parseInt((timer / 60) % 60, 10);
                                    seconds = parseInt(timer % 60, 10);
                                    days = days < 10 ? "0" + days : days;
                                    hours = hours < 10 ? "0" + hours : hours;
                                    minutes = minutes < 10 ? "0" + minutes : minutes;
                                    seconds = seconds < 10 ? "0" + seconds : seconds;
                                    this.discountTimer.days = days
                                    this.discountTimer.hours = hours
                                    this.discountTimer.minutes = minutes
                                    this.discountTimer.seconds = seconds
                                }
                            }, 1000);
                        },
                        clearDiscountTimer() {
                            clearInterval(this.discountTimer.invertvalData)
                            this.discountTimer.invertvalData = null
                            this.$forceUpdate();
                        },

                        setupAutocomplete() {
                            // console.log('this.seee',this.element)
                            if (!window.google?.maps?.places) return
                            // const addressInput =document.querySelector(`[name='address']`)
                            const addressInput =document.getElementById('shipping-address')
                            if (!addressInput) return
                            const autoComplete = new window.google.maps.places.Autocomplete(addressInput, {
                            fields: ["address_components", "name"],
                            types: ["address"],
                            });
                            autoComplete.addListener("place_changed", () => {
                            const place = autoComplete.getPlace();
                            const valueByComponentType = place.address_components.reduce((acc, component) => {
                                const type = component.types
                                if (type.includes('locality')) {
                                acc['locality'] = component.long_name
                                } else if (type.includes('administrative_area_level_2')) {
                                acc['administrative_area_level_2'] = component.long_name
                                } else if (type.includes('administrative_area_level_1')) {
                                acc['administrative_area_level_1'] = component.long_name
                                } else if (type.includes('country')) {
                                acc['country'] = component.long_name
                                } else if (type.includes('postal_code')) {
                                acc['postal_code'] = component.long_name
                                }
                                return acc
                            }, {})
                            this.customer.address = place.name
                            this.customer.city = valueByComponentType['locality'] || valueByComponentType['administrative_area_level_2']
                            this.customer.country = valueByComponentType['country']
                            this.customer.postal_code = valueByComponentType['postal_code'] ? valueByComponentType['postal_code'] : ''
                            if(!this.states.find(s => s == valueByComponentType['administrative_area_level_1'])){
                                this.states.push(valueByComponentType['administrative_area_level_1'])
                            }
                            this.customer.state = valueByComponentType['administrative_area_level_1']
                            })

ted-Time Offer\u003C\/span\u003E\r\n\r\n        \u003Cdiv class=\u0022split-hero-image-wrap\u0022 v-if=\u0022orderFormSetting.is_product_image\u0022\u003E\r\n          \u003Cinput type=\u0022file\u0022 style=\u0022display: none;\u0022 ref=\u0022productImageInput\u0022 @change=\u0022onProductFileChange($event)\u0022 \/\u003E\r\n          \u003Cimg\r\n              v-if=\u0022isEditorMode \u0026\u0026 orderFormSetting.product \u0026\u0026 orderFormSetting.product.image\u0022\r\n              class=\u0022split-hero-image\u0022\r\n              :src=\u0022productImage ? productImageUrl : productImageSrc\u0022\r\n              :alt=\u0022orderFormSetting.product.name || \u0027\u0027\u0022\r\n              @click=\u0022$refs.productImageInput.click()\u0022\r\n          \/\u003E\r\n\r\n          \u003Cimg\r\n              v-else-if=\u0022imageUrlProduct\u0022\r\n              class=\u0022split-hero-image\u0022\r\n              :src=\u0022`${assetUrl}\/storage\/${imageUrlProduct}`\u0022\r\n              :alt=\u0022orderFormSetting.product?.name || \u0027\u0027\u0022\r\n          \/\u003E\r\n\r\n          \u003Cdiv class=\u0022split-hero-image split-hero-image-placeholder\u0022 v-else\u003E\r\n            \u003Cspan\u003Eproduct\u003Cbr\/\u003Eshot\u003C\/span\u003E\r\n          \u003C\/div\u003E\r\n        \u003C\/div\u003E\r\n\r\n        \u003Ch1 class=\u0022split-title\u0022 @click.stop=\u0022setSetting(\u0027headline\u0027)\u0022 v-if=\u0022orderFormSetting.is_headline\u0022\u003E\r\n          \u003Cspan\r\n              class=\u0022split-editable\u0022\r\n              :contenteditable=\u0022isEditorMode\u0022\r\n              @input=\u0022updateInputText($event, \u0027headline\u0027)\u0022\r\n              @blur=\u0022updateData($event, \u0027headline\u0027)\u0022\r\n              v-html=\u0022orderFormSetting.headline || (orderFormSetting.product ? orderFormSetting.product.name : \u0027Your Product\u0027)\u0022\r\n          \u003E\u003C\/span\u003E\r\n        \u003C\/h1\u003E\r\n        \u003Cp class=\u0022split-subtitle\u0022 @click.stop=\u0022setSetting(\u0027subheadline\u0027)\u0022 v-if=\u0022orderFormSetting.is_subheadline\u0022\u003E\r\n          \u003Cspan\r\n              class=\u0022split-editable\u0022\r\n              :contenteditable=\u0022isEditorMode\u0022\r\n              @input=\u0022updateInputText($event, \u0027subheadline\u0027)\u0022\r\n              @blur=\u0022updateData($event, \u0027subheadline\u0027)\u0022\r\n              v-html=\u0022orderFormSetting.subheadline || (orderFormSetting.product \u0026\u0026 orderFormSetting.product.description) || \u0027The fastest way to ship work you\u2019re proud of.\u0027\u0022\r\n          \u003E\u003C\/span\u003E\r\n        \u003C\/p\u003E\r\n\r\n        \u003Cul class=\u0022split-bullets\u0022 @click.stop=\u0022setSetting(\u0027bullets\u0027)\u0022 v-if=\u0022orderFormSetting.is_bullets \u0026\u0026 orderFormSetting.bullets \u0026\u0026 orderFormSetting.bullets.length\u0022\u003E\r\n          \u003Cli class=\u0022split-bullet\u0022 v-for=\u0022(bullet, bIndex) in orderFormSetting.bullets\u0022 :key=\u0022bullet.id || bIndex\u0022\u003E\r\n            \u003Cspan class=\u0022split-bullet-check\u0022\u003E\r\n              \u003Csvg width=\u002212\u0022 height=\u002212\u0022 viewBox=\u00220 0 12 12\u0022 fill=\u0022none\u0022 xmlns=\u0022http:\/\/www.w3.org\/2000\/svg\u0022\u003E\r\n                \u003Cpath d=\u0022M2 6l2.5 2.5L10 3\u0022 stroke=\u0022currentColor\u0022 stroke-width=\u00221.8\u0022 stroke-linecap=\u0022round\u0022 stroke-linejoin=\u0022round\u0022\/\u003E\r\n              \u003C\/svg\u003E\r\n            \u003C\/span\u003E\r\n            \u003Cspan\r\n                class=\u0022split-bullet-text split-editable\u0022\r\n                :contenteditable=\u0022isEditorMode\u0022\r\n                @input=\u0022checkUpdated[\u0027bullet_\u0027 + bIndex] = true\u0022\r\n                @blur=\u0022updateBullet($event, bIndex, bullet)\u0022\r\n                v-html=\u0022bullet.name\u0022\r\n            \u003E\u003C\/span\u003E\r\n            \u003Cbutton\r\n                v-if=\u0022isEditorMode\u0022\r\n                type=\u0022button\u0022\r\n                class=\u0022split-bullet-delete\u0022\r\n                title=\u0022Delete bullet\u0022\r\n                @click.stop=\u0022deleteBullet(bullet, bIndex)\u0022\r\n            \u003E\u0026times;\u003C\/button\u003E\r\n          \u003C\/li\u003E\r\n          \u003Cli v-if=\u0022isEditorMode\u0022 class=\u0022split-bullet split-bullet-add-row\u0022\u003E\r\n            \u003Cbutton type=\u0022button\u0022 class=\u0022split-bullet-add\u0022 @click.stop=\u0022addBullet\u0022\u003E+ Add bullet\u003C\/button\u003E\r\n          \u003C\/li\u003E\r\n        \u003C\/ul\u003E\r\n        \u003Cul class=\u0022split-bullets\u0022 @click.stop=\u0022setSetting(\u0027bullets\u0027)\u0022 v-else-if=\u0022orderFormSetting.is_bullets\u0022\u003E\r\n          \u003Cli class=\u0022split-bullet\u0022\u003E\r\n            \u003Cspan class=\u0022split-bullet-check\u0022\u003E\u003Csvg width=\u002212\u0022 height=\u002212\u0022 viewBox=\u00220 0 12 12\u0022 fill=\u0022none\u0022 xmlns=\u0022http:\/\/www.w3.org\/2000\/svg\u0022\u003E\u003Cpath d=\u0022M2 6l2.5 2.5L10 3\u0022 stroke=\u0022currentColor\u0022 stroke-width=\u00221.8\u0022 stroke-linecap=\u0022round\u0022 stroke-linejoin=\u0022round\u0022\/\u003E\u003C\/svg\u003E\u003C\/span\u003E\r\n            \u003Cspan class=\u0022split-bullet-text\u0022\u003EBuilt for teams who ship daily \u2014 not quarterly\u003C\/span\u003E\r\n          \u003C\/li\u003E\r\n          \u003Cli class=\u0022split-bullet\u0022\u003E\r\n            \u003Cspan class=\u0022split-bullet-check\u0022\u003E\u003Csvg width=\u002212\u0022 height=\u002212\u0022 viewBox=\u00220 0 12 12\u0022 fill=\u0022none\u0022 xmlns=\u0022http:\/\/www.w3.org\/2000\/svg\u0022\u003E\u003Cpath d=\u0022M2 6l2.5 2.5L10 3\u0022 stroke=\u0022currentColor\u0022 stroke-width=\u00221.8\u0022 stroke-linecap=\u0022round\u0022 stroke-linejoin=\u0022round\u0022\/\u003E\u003C\/svg\u003E\u003C\/span\u003E\r\n            \u003Cspan class=\u0022split-bullet-text\u0022\u003E30-day no-questions refund, cancel in one click\u003C\/span\u003E\r\n          \u003C\/li\u003E\r\n          \u003Cli class=\u0022split-bullet\u0022\u003E\r\n            \u003Cspan class=\u0022split-bullet-check\u0022\u003E\u003Csvg width=\u002212\u0022 height=\u002212\u0022 viewBox=\u00220 0 12 12\u0022 fill=\u0022none\u0022 xmlns=\u0022http:\/\/www.w3.org\/2000\/svg\u0022\u003E\u003Cpath d=\u0022M2 6l2.5 2.5L10 3\u0022 stroke=\u0022currentColor\u0022 stroke-width=\u00221.8\u0022 stroke-linecap=\u0022round\u0022 stroke-linejoin=\u0022round\u0022\/\u003E\u003C\/svg\u003E\u003C\/span\u003E\r\n            \u003Cspan class=\u0022split-bullet-text\u0022\u003ETrusted by 10,000+ creators worldwide\u003C\/span\u003E\r\n          \u003C\/li\u003E\r\n        \u003C\/ul\u003E\r\n\r\n        \u003Cdiv class=\u0022split-hero-divider\u0022\u003E\u003C\/div\u003E\r\n\r\n        \u003Cdiv class=\u0022split-trust-row\u0022 v-if=\u0022orderFormSetting.is_seal\u0022\u003E\r\n          \u003Cdiv class=\u0022split-trust\u0022 v-if=\u0022orderFormSetting.is_security_seal\u0022\u003E\r\n            \u003Cdiv class=\u0022split-trust-icon split-trust-icon-money\u0022\u003E\r\n              \u003Csvg width=\u002220\u0022 height=\u002220\u0022 viewBox=\u00220 0 24 24\u0022 fill=\u0022none\u0022 xmlns=\u0022http:\/\/www.w3.org\/2000\/svg\u0022\u003E\r\n                \u003Cpath d=\u0022M4 12a8 8 0 0 1 14.5-4.5M20 4v4h-4M20 12a8 8 0 0 1-14.5 4.5M4 20v-4h4\u0022 stroke=\u0022currentColor\u0022 stroke-width=\u00222\u0022 stroke-linecap=\u0022round\u0022 stroke-linejoin=\u0022round\u0022\/\u003E\r\n              \u003C\/svg\u003E\r\n            \u003C\/div\u003E\r\n            \u003Cspan class=\u0022split-trust-label\u0022\u003E30-Day\u003Cbr\/\u003ERefund\u003C\/span\u003E\r\n          \u003C\/div\u003E\r\n          \u003Cdiv class=\u0022split-trust\u0022 v-if=\u0022orderFormSetting.is_privacy_seal\u0022\u003E\r\n            \u003Cdiv class=\u0022split-trust-icon split-trust-icon-ssl\u0022\u003E\r\n              \u003Csvg width=\u002220\u0022 height=\u002220\u0022 viewBox=\u00220 0 24 24\u0022 fill=\u0022none\u0022 xmlns=\u0022http:\/\/www.w3.org\/2000\/svg\u0022\u003E\r\n                \u003Cpath d=\u0022M12 3l8 3v5.5c0 4.7-3.3 8.7-8 10-4.7-1.3-8-5.3-8-10V6l8-3z\u0022 stroke=\u0022currentColor\u0022 stroke-width=\u00222\u0022 stroke-linejoin=\u0022round\u0022\/\u003E\r\n                \u003Cpath d=\u0022M9 12l2 2 4-4\u0022 stroke=\u0022currentColor\u0022 stroke-width=\u00222\u0022 stroke-linecap=\u0022round\u0022 stroke-linejoin=\u0022round\u0022\/\u003E\r\n              \u003C\/svg\u003E\r\n            \u003C\/div\u003E\r\n            \u003Cspan class=\u0022split-trust-label\u0022\u003ESSL\u003Cbr\/\u003ESecured\u003C\/span\u003E\r\n          \u003C\/div\u003E\r\n          \u003Cdiv class=\u0022split-trust\u0022 v-if=\u0022orderFormSetting.is_information_seal\u0022\u003E\r\n            \u003Cdiv class=\u0022split-trust-icon split-trust-icon-sat\u0022\u003E\r\n              \u003Csvg width=\u002220\u0022 height=\u002220\u0022 viewBox=\u00220 0 24 24\u0022 fill=\u0022none\u0022 xmlns=\u0022http:\/\/www.w3.org\/2000\/svg\u0022\u003E\r\n                \u003Cpath d=\u0022M12 2l3 6.5 7 1-5 4.8 1.2 7L12 18l-6.2 3.3L7 14.3 2 9.5l7-1L12 2z\u0022 stroke=\u0022currentColor\u0022 stroke-width=\u00222\u0022 stroke-linejoin=\u0022round\u0022\/\u003E\r\n              \u003C\/svg\u003E\r\n            \u003C\/div\u003E\r\n            \u003Cspan class=\u0022split-trust-label\u0022\u003E100%\u003Cbr\/\u003ESatisfaction\u003C\/span\u003E\r\n          \u003C\/div\u003E\r\n        \u003C\/div\u003E\r\n      \u003C\/aside\u003E\r\n\r\n      \u003C!-- ============ TESTIMONIALS \u2014 second card in the left column,\r\n           directly under the hero, scrolls\/sticks together with it. ============ --\u003E\r\n      \u003Cdiv class=\u0022split-testimonials\u0022 v-if=\u0022orderFormSetting.is_testimonials \u0026\u0026 ((orderFormSetting.testimonials \u0026\u0026 orderFormSetting.testimonials.length) || isEditorMode)\u0022 @click.stop=\u0022setSetting(\u0027testimonials\u0027)\u0022\u003E\r\n        \u003Cdiv\r\n            class=\u0022split-testimonial\u0022\r\n            v-for=\u0022(t, ti) in (orderFormSetting.testimonials || [])\u0022\r\n            :key=\u0022t.id || ti\u0022\r\n        \u003E\r\n          \u003Cdiv class=\u0022split-testimonial-head\u0022\u003E\r\n            \u003Cdiv class=\u0022split-testimonial-avatar-wrap\u0022\u003E\r\n              \u003Cimg class=\u0022split-testimonial-avatar\u0022 :src=\u0022testimonialImageSrc(t)\u0022 :alt=\u0022t.name || \u0027\u0027\u0022 v-if=\u0022t.image\u0022 \/\u003E\r\n              \u003Cdiv class=\u0022split-testimonial-avatar split-testimonial-avatar-fallback\u0022 v-else\u003E\r\n                {{ ((t.name || \u0027?\u0027).replace(\/\u003C[^\u003E]+\u003E\/g, \u0027\u0027).trim().charAt(0) || \u0027?\u0027).toUpperCase() }}\r\n              \u003C\/div\u003E\r\n              \u003Cinput\r\n                  v-if=\u0022isEditorMode\u0022\r\n                  type=\u0022file\u0022\r\n                  accept=\u0022image\/*\u0022\r\n                  :ref=\u0022\u0027testimonialImageInput_\u0027 + ti\u0022\r\n                  style=\u0022display:none\u0022\r\n                  @change=\u0022onTestimonialImageFileChange($event, t, ti)\u0022\r\n              \/\u003E\r\n              \u003Cbutton\r\n                  v-if=\u0022isEditorMode\u0022\r\n                  type=\u0022button\u0022\r\n                  class=\u0022split-testimonial-avatar-edit\u0022\r\n                  title=\u0022Change photo\u0022\r\n                  @click.stop=\u0022$refs[\u0027testimonialImageInput_\u0027 + ti][0].click()\u0022\r\n              \u003E\u0026#9998;\u003C\/button\u003E\r\n            \u003C\/div\u003E\r\n            \u003Cdiv class=\u0022split-testimonial-meta\u0022\u003E\r\n              \u003Cdiv\r\n                  class=\u0022split-testimonial-name split-editable\u0022\r\n                  :contenteditable=\u0022isEditorMode\u0022\r\n                  @input=\u0022checkUpdated[\u0027testimonial_name_\u0027 + ti] = true\u0022\r\n                  @blur=\u0022updateTestimonialName($event, ti, t)\u0022\r\n                  v-html=\u0022t.name || \u0027Anonymous\u0027\u0022\r\n              \u003E\u003C\/div\u003E\r\n              \u003Cdiv class=\u0022split-testimonial-stars\u0022\u003E\u0026#9733;\u0026#9733;\u0026#9733;\u0026#9733;\u0026#9733;\u003C\/div\u003E\r\n            \u003C\/div\u003E\r\n            \u003Cbutton\r\n                v-if=\u0022isEditorMode\u0022\r\n                type=\u0022button\u0022\r\n                class=\u0022split-testimonial-delete\u0022\r\n                title=\u0022Delete testimonial\u0022\r\n                @click.stop=\u0022deleteTestimonial(t, ti)\u0022\r\n            \u003E\u0026times;\u003C\/button\u003E\r\n          \u003C\/div\u003E\r\n          \u003Cdiv\r\n              class=\u0022split-testimonial-quote split-editable\u0022\r\n              :contenteditable=\u0022isEditorMode\u0022\r\n              @input=\u0022checkUpdated[\u0027testimonial_desc_\u0027 + ti] = true\u0022\r\n              @blur=\u0022updateTestimonialDescription($event, ti, t)\u0022\r\n              v-html=\u0022t.description\u0022\r\n          \u003E\u003C\/div\u003E\r\n        \u003C\/div\u003E\r\n        \u003Cbutton\r\n            v-if=\u0022isEditorMode\u0022\r\n            type=\u0022button\u0022\r\n            class=\u0022split-testimonial-add\u0022\r\n            @click.stop=\u0022addTestimonial\u0022\r\n        \u003E+ Add testimonial\u003C\/button\u003E\r\n      \u003C\/div\u003E\r\n\r\n    \u003C\/div\u003E\u003C!-- \/.split-left-col --\u003E\r\n\r\n    \u003C!-- ============ RIGHT: FORM PANEL ============ --\u003E\r\n    \u003Cdiv class=\u0022split-form\u0022 @click.stop=\u0022setSetting(\u0027form\u0027)\u0022\u003E\r\n\r\n      \u003C!-- Contact --\u003E\r\n      \u003Ch2 class=\u0022split-section-head\u0022\u003E{{ orderFormSetting.orderform_title || \u0027Contact Info\u0027 }}\u003C\/h2\u003E\r\n      \u003Cp\r\n          class=\u0022split-section-sub\u0022\r\n          v-if=\u0022orderFormSetting.is_orderform_sub_title_show \u0026\u0026 orderFormSetting.orderform_sub_title\u0022\r\n      \u003E{{ orderFormSetting.orderform_sub_title }}\u003C\/p\u003E\r\n\r\n      \u003Cdiv class=\u0022split-form-grid-2\u0022\u003E\r\n        \u003Cdiv class=\u0022split-field\u0022 v-if=\u0022orderFormSetting.first_name \u0026\u0026 orderFormSetting.first_name.is_show\u0022\u003E\r\n          \u003Clabel class=\u0022split-label\u0022 :class=\u0022{ \u0027split-label-invalid\u0027: validation.first_name \u0026\u0026 validation.first_name.is_required_error }\u0022\u003EFirst Name\u003C\/label\u003E\r\n          \u003Cinput\r\n              class=\u0022split-input\u0022\r\n              type=\u0022text\u0022\r\n              :placeholder=\u0022orderFormSetting.first_name.placeholder || \u0027Your first name\u0027\u0022\r\n              v-model=\u0022customer.first_name\u0022\r\n              :class=\u0022{ \u0027split-invalid\u0027: validation.first_name \u0026\u0026 validation.first_name.is_required_error }\u0022\r\n          \/\u003E\r\n          \u003Cdiv class=\u0022split-field-error split-shake\u0022 v-if=\u0022validation.first_name \u0026\u0026 validation.first_name.is_required_error\u0022\u003EFirst name is required\u003C\/div\u003E\r\n        \u003C\/div\u003E\r\n        \u003Cdiv class=\u0022split-field\u0022 v-if=\u0022orderFormSetting.last_name \u0026\u0026 orderFormSetting.last_name.is_show\u0022\u003E\r\n          \u003Clabel class=\u0022split-label\u0022 :class=\u0022{ \u0027split-label-invalid\u0027: validation.last_name \u0026\u0026 validation.last_name.is_required_error }\u0022\u003ELast Name\u003C\/label\u003E\r\n          \u003Cinput\r\n              class=\u0022split-input\u0022\r\n              type=\u0022text\u0022\r\n              :placeholder=\u0022orderFormSetting.last_name.placeholder || \u0027Your last name\u0027\u0022\r\n              v-model=\u0022customer.last_name\u0022\r\n              :class=\u0022{ \u0027split-invalid\u0027: validation.last_name \u0026\u0026 validation.last_name.is_required_error }\u0022\r\n          \/\u003E\r\n          \u003Cdiv class=\u0022split-field-error split-shake\u0022 v-if=\u0022validation.last_name \u0026\u0026 validation.last_name.is_required_error\u0022\u003ELast name is required\u003C\/div\u003E\r\n        \u003C\/div\u003E\r\n      \u003C\/div\u003E\r\n\r\n      \u003Cdiv class=\u0022split-field\u0022 v-if=\u0022orderFormSetting.email \u0026\u0026 orderFormSetting.email.is_show\u0022\u003E\r\n        \u003Clabel class=\u0022split-label\u0022 :class=\u0022{ \u0027split-label-invalid\u0027: validation.email \u0026\u0026 (validation.email.is_required_error || validation.email.is_email_error) }\u0022\u003EEmail\u003C\/label\u003E\r\n        \u003Cinput\r\n            class=\u0022split-input\u0022\r\n            type=\u0022email\u0022\r\n            :placeholder=\u0022orderFormSetting.email.placeholder || \u0027you@example.com\u0027\u0022\r\n            v-model=\u0022customer.email\u0022\r\n            :class=\u0022{ \u0027split-invalid\u0027: validation.email \u0026\u0026 (validation.email.is_required_error || validation.email.is_email_error) }\u0022\r\n        \/\u003E\r\n        \u003Cdiv class=\u0022split-field-error split-shake\u0022 v-if=\u0022validation.email \u0026\u0026 validation.email.is_required_error\u0022\u003EThis field is required\u003C\/div\u003E\r\n        \u003Cdiv class=\u0022split-field-error split-shake\u0022 v-if=\u0022validation.email \u0026\u0026 validation.email.is_email_error\u0022\u003EPlease enter a valid email\u003C\/div\u003E\r\n      \u003C\/div\u003E\r\n\r\n      \u003Cd 0022 v-if=\u0022cardError \u0026\u0026 cardError.length\u0022\u003E{{ cardError[0] }}\u003C\/div\u003E\r\n          \u003C\/div\u003E\r\n          \u003Cdiv class=\u0022split-form-grid-2\u0022\u003E\r\n            \u003Cdiv class=\u0022split-field\u0022\u003E\r\n              \u003Clabel class=\u0022split-label\u0022\u003EExpiration (MM \/ YY)\u003C\/label\u003E\r\n              \u003Cdiv class=\u0022split-exp-row\u0022\u003E\r\n                \u003Cselect\r\n                    class=\u0022split-input split-exp-select\u0022\r\n                    id=\u0022cardMonth\u0022\r\n                    v-model=\u0022cardMonth\u0022\r\n                    data-ref=\u0022cardDate\u0022\r\n                    :class=\u0022{ \u0027split-invalid\u0027: monthError \u0026\u0026 monthError.length }\u0022\r\n                \u003E\r\n                  \u003Coption value=\u0022\u0022 disabled\u003EMM\u003C\/option\u003E\r\n                  \u003Coption v-for=\u0022n in 12\u0022 :key=\u0022n\u0022 :value=\u0022n \u003C 10 ? \u00270\u0027 + n : n\u0022 :disabled=\u0022n \u003C minCardMonth\u0022\u003E{{ n \u003C 10 ? \u00270\u0027 + n : n }}\u003C\/option\u003E\r\n                \u003C\/select\u003E\r\n                \u003Cselect\r\n                    class=\u0022split-input split-exp-select\u0022\r\n                    id=\u0022cardYear\u0022\r\n                    v-model=\u0022cardYear\u0022\r\n                    :class=\u0022{ \u0027split-invalid\u0027: yearError \u0026\u0026 yearError.length }\u0022\r\n                \u003E\r\n                  \u003Coption value=\u0022\u0022 disabled\u003EYY\u003C\/option\u003E\r\n                  \u003Coption v-for=\u0022(y, yi) in 15\u0022 :key=\u0022yi\u0022 :value=\u0022minCardYear + yi\u0022\u003E{{ minCardYear + yi }}\u003C\/option\u003E\r\n                \u003C\/select\u003E\r\n              \u003C\/div\u003E\r\n              \u003Cdiv class=\u0022split-field-error\u0022 v-if=\u0022(monthError \u0026\u0026 monthError.length) || (yearError \u0026\u0026 yearError.length)\u0022\u003ESelect month and year\u003C\/div\u003E\r\n            \u003C\/div\u003E\r\n            \u003Cdiv class=\u0022split-field\u0022\u003E\r\n              \u003Clabel class=\u0022split-label\u0022\u003ECVC\u003C\/label\u003E\r\n              \u003Cinput\r\n                  class=\u0022split-input\u0022\r\n                  type=\u0022text\u0022\r\n                  id=\u0022cardCvv\u0022\r\n                  placeholder=\u0022CVC\u0022\r\n                  v-mask=\u0022\u0027####\u0027\u0022\r\n                  maxlength=\u00224\u0022\r\n                  autocomplete=\u0022off\u0022\r\n                  v-model=\u0022cardCvv\u0022\r\n                  data-ref=\u0022cardCvv\u0022\r\n                  :class=\u0022{ \u0027split-invalid\u0027: cvvError \u0026\u0026 cvvError.length }\u0022\r\n              \/\u003E\r\n              \u003Cdiv class=\u0022split-field-error\u0022 v-if=\u0022cvvError \u0026\u0026 cvvError.length\u0022\u003E{{ cvvError[0] }}\u003C\/div\u003E\r\n            \u003C\/div\u003E\r\n          \u003C\/div\u003E\r\n        \u003C\/div\u003E\r\n      \u003C\/div\u003E\r\n\r\n      \u003Cp v-if=\u0022isEditorMode\u0022 class=\u0022split-legal\u0022\u003EBy providing your card information, you allow Nicely Media LLC to charge your card for future payments in accordance with their terms.\u003C\/p\u003E\r\n\r\n      \u003C!--\r\n        Bump offers \u2014 one-click upsells. Visibility:\r\n          \u2022 Editor mode: shown whenever `is_bump_offer` is on, even if no\r\n            bumps are attached yet \u2014 empty-state invites the admin to attach.\r\n          \u2022 Live mode: only shown if `is_bump_offer` is on AND productBumpOffer\r\n            has entries.\r\n        toggleBump() flips the id in usedBumpOffersIds. The inline order\r\n        summary below already renders selected bumps via usedBumpDetails.\r\n      --\u003E\r\n      \u003Cdiv\r\n          class=\u0022split-bumps\u0022\r\n          v-if=\u0022orderFormSetting.is_bump_offer \u0026\u0026 ((productBumpOffer \u0026\u0026 productBumpOffer.length) || isEditorMode)\u0022\r\n          @click.stop=\u0022setSetting(\u0027bump_offer\u0027)\u0022\r\n      \u003E\r\n        \u003Clabel\r\n            v-for=\u0022(bump, bIdx) in (productBumpOffer || [])\u0022\r\n            :key=\u0022bump.id || bIdx\u0022\r\n            class=\u0022split-bump\u0022\r\n            :class=\u0022{ \u0027is-selected\u0027: usedBumpOffersIds.includes(bump.id) }\u0022\r\n        \u003E\r\n          \u003Cinput\r\n              type=\u0022checkbox\u0022\r\n              class=\u0022split-bump-checkbox\u0022\r\n              :checked=\u0022usedBumpOffersIds.includes(bump.id)\u0022\r\n              @change.stop=\u0022toggleBump(bump)\u0022\r\n              @click.stop\r\n          \/\u003E\r\n          \u003Cdiv class=\u0022split-bump-body\u0022\u003E\r\n            \u003Cdiv class=\u0022split-bump-headline\u0022 v-html=\u0022bump.name || \u0027Add this offer\u0027\u0022\u003E\u003C\/div\u003E\r\n            \u003Cdiv class=\u0022split-bump-desc\u0022 v-if=\u0022bump.description\u0022 v-html=\u0022bump.description\u0022\u003E\u003C\/div\u003E\r\n            \u003Cdiv class=\u0022split-bump-cta\u0022\u003E\r\n                \u003Cspan v-if=\u0022bump.type == \u0027paid\u0027 \u0026\u0026 bump.product \u0026\u0026 bump.product.price \u003E 0\u0022\u003E\r\n                  Add for \u003Cb\u003E${{ Number(bump.product.price).toFixed(2) }}\u003C\/b\u003E\r\n                \u003C\/span\u003E\r\n              \u003Cspan v-else\u003E\r\n                  Add \u003Cb\u003EFREE\u003C\/b\u003E\r\n                \u003C\/span\u003E\r\n            \u003C\/div\u003E\r\n          \u003C\/div\u003E\r\n        \u003C\/label\u003E\r\n\r\n        \u003Cdiv\r\n            v-if=\u0022isEditorMode \u0026\u0026 (!productBumpOffer || !productBumpOffer.length)\u0022\r\n            class=\u0022split-bump-empty\u0022\r\n        \u003E\r\n          \u003Cdiv class=\u0022split-bump-empty-icon\u0022\u003E+\u003C\/div\u003E\r\n          \u003Cdiv class=\u0022split-bump-empty-body\u0022\u003E\r\n            \u003Cdiv class=\u0022split-bump-empty-title\u0022\u003ENo bump offers attached\u003C\/div\u003E\r\n            \u003Cdiv class=\u0022split-bump-empty-desc\u0022\u003E\r\n              Click here to open Bump Settings and pick offers to show on this checkout.\r\n            \u003C\/div\u003E\r\n          \u003C\/div\u003E\r\n        \u003C\/div\u003E\r\n      \u003C\/div\u003E\r\n\r\n      \u003C!-- Payment Options (one-time \/ subscription \/ payment plan) --\u003E\r\n      \u003Cdiv class=\u0022split-payment-options\u0022 v-if=\u0022showOneTime || (showPaymentOption \u0026\u0026 payment_option \u0026\u0026 payment_option.length)\u0022\u003E\r\n        \u003Ch3 class=\u0022split-subsection-head\u0022\u003EChoose your plan\u003C\/h3\u003E\r\n        \u003Clabel\r\n            v-if=\u0022showOneTime\u0022\r\n            class=\u0022split-plan\u0022\r\n            :class=\u0022{ \u0027is-selected\u0027: payment_option_id == \u0027one-time\u0027 }\u0022\r\n        \u003E\r\n          \u003Cinput type=\u0022radio\u0022 name=\u0022split-payment-option\u0022 value=\u0022one-time\u0022 v-model=\u0022payment_option_id\u0022 \/\u003E\r\n          \u003Cdiv class=\u0022split-plan-body\u0022\u003E\r\n            \u003Cdiv class=\u0022split-plan-title\u0022\u003E\r\n              \u003Cspan\u003E{{ orderFormSetting.product ? orderFormSetting.product.name : \u0027One-time\u0027 }}\u003C\/span\u003E\r\n              \u003Cspan class=\u0022split-plan-price\u0022 v-if=\u0022payment_option_id == \u0027one-time\u0027 \u0026\u0026 couponChecked \u0026\u0026 !isCouponInvalid\u0022\u003E\r\n                  \u003Cdel\u003E${{ productPriceOption ? productPriceOption.toFixed(2) : \u00270.00\u0027 }}\u003C\/del\u003E\r\n                  ${{ ((productPriceOption || 0) - couponDiscount).toFixed(2) }}\r\n                \u003C\/span\u003E\r\n              \u003Cspan class=\u0022split-plan-price\u0022 v-else\u003E\r\n                  {{ ((productPriceOption || 0) - (discountedPrice || 0)) \u003E 0 ? \u0027$\u0027 + ((productPriceOption || 0) - (discountedPrice || 0)).toFixed(2) : \u0027FREE\u0027 }}\r\n                \u003C\/span\u003E\r\n            \u003C\/div\u003E\r\n            \u003Cdiv class=\u0022split-plan-desc\u0022 v-if=\u0022orderFormSetting.product \u0026\u0026 orderFormSetting.product.description\u0022\u003E\r\n              {{ orderFormSetting.product.description }}\r\n            \u003C\/div\u003E\r\n          \u003C\/div\u003E\r\n        \u003C\/label\u003E\r\n\r\n        \u003Clabel\r\n            v-for=\u0022(p, index) in (showPaymentOption ? payment_option : [])\u0022\r\n            :key=\u0022p.id || index\u0022\r\n            class=\u0022split-plan\u0022\r\n            :class=\u0022{ \u0027is-selected\u0027: payment_option_id == p.id }\u0022\r\n        \u003E\r\n          \u003Cinput type=\u0022radio\u0022 name=\u0022split-payment-option\u0022 :value=\u0022p.id\u0022 v-model=\u0022payment_option_id\u0022 \/\u003E\r\n          \u003Cdiv class=\u0022split-plan-body\u0022\u003E\r\n            \u003Cdiv class=\u0022split-plan-title\u0022\u003E\r\n              \u003Cspan\u003E{{ p.plan_name }}\u003C\/span\u003E\r\n              \u003Cspan class=\u0022split-plan-price\u0022 v-if=\u0022p.is_trial \u0026\u0026 !p.is_trial_checked\u0022\u003E\r\n                  ${{ p.amount ? Number(p.amount).toFixed(2) : \u00270.00\u0027 }}\r\n                \u003C\/span\u003E\r\n              \u003Cspan class=\u0022split-plan-price\u0022 v-else-if=\u0022p.is_trial \u0026\u0026 p.is_trial_checked\u0022\u003E\r\n                  ${{ p.trial_amount != null ? Number(p.trial_amount).toFixed(2) : \u00270.00\u0027 }}\r\n                \u003C\/span\u003E\r\n              \u003Cspan class=\u0022split-plan-price\u0022 v-else\u003E\r\n                  ${{ p.amount ? Number(p.amount).toFixed(2) : \u00270.00\u0027 }}\r\n                \u003C\/span\u003E\r\n            \u003C\/div\u003E\r\n            \u003Cdiv class=\u0022split-plan-desc\u0022 v-if=\u0022p.is_trial \u0026\u0026 p.payment_type != \u0027paymentPlan\u0027\u0022\u003E\r\n              Get started with only ${{ p.trial_amount }} for the initial {{ p.trial_period }} days, and then just ${{ Number(p.amount).toFixed(2) }}\/{{ getBillingPeriod(p.billing_period) }}\r\n            \u003C\/div\u003E\r\n            \u003Cdiv class=\u0022split-plan-desc\u0022 v-else-if=\u0022p.is_trial \u0026\u0026 p.payment_type == \u0027paymentPlan\u0027\u0022\u003E\r\n              Get started with only ${{ p.trial_amount }} for the initial {{ p.trial_period }} days, and then just ${{ Number(p.amount).toFixed(2) }}\/{{ getBillingPeriod(p.billing_period) }}, with a total of {{ p.no_of_payment }} payments\r\n            \u003C\/div\u003E\r\n            \u003Cdiv class=\u0022split-plan-desc\u0022 v-else-if=\u0022p.payment_type == \u0027paymentPlan\u0027\u0022\u003E\r\n              Get started with ${{ Number(p.amount).toFixed(2) }} today, and then {{ p.no_of_payment - 1 }} more payments of ${{ Number(p.amount).toFixed(2) }}\/{{ getBillingPeriod(p.billing_period) }}\r\n            \u003C\/div\u003E\r\n            \u003Cdiv class=\u0022split-plan-desc\u0022 v-else-if=\u0022p.payment_type == \u0027subscription\u0027\u0022\u003E\r\n              Signup today for just ${{ Number(p.amount).toFixed(2) }}\/{{ getBillingPeriod(p.billing_period) }}\r\n            \u003C\/div\u003E\r\n          \u003C\/div\u003E\r\n        \u003C\/label\u003E\r\n      \u003C\/div\u003E\r\n\r\n      \u003C!-- Coupon Code --\u003E\r\n      \u003Cdiv class=\u0022split-coupon\u0022 v-if=\u0022orderFormSetting \u0026\u0026 orderFormSetting.is_coupon_message\u0022 @click.stop=\u0022setSetting(\u0027coupon\u0027)\u0022\u003E\r\n        \u003Cp class=\u0022split-coupon-message\u0022 v-if=\u0022coupon\u0022\u003E\r\n          \u0026#9432;\r\n          \u003Cspan v-if=\u0022coupon.include_limited_units \u0026\u0026 !coupon.include_time_limitation\u0022\u003E\r\n              There are only \u003Cb\u003E{{ coupon.unit }}\u003C\/b\u003E promo codes left.\r\n            \u003C\/span\u003E\r\n          \u003Cspan v-if=\u0022!coupon.include_limited_units \u0026\u0026 coupon.include_time_limitation \u0026\u0026 scarcityCouponTimer\u0022\u003E\r\n              There are only\r\n              \u003Cb\u003E\r\n                \u003Cspan v-if=\u0022scarcityCouponTimer.days \u003E 0\u0022\u003E{{ scarcityCouponTimer.days }}d: \u003C\/span\u003E{{ scarcityCouponTimer.hours }}h: {{ scarcityCouponTimer.minutes }}m: {{ scarcityCouponTimer.seconds }}s\r\n              \u003C\/b\u003E\r\n              left to claim this promo code.\r\n            \u003C\/span\u003E\r\n          \u003Cspan v-if=\u0022coupon.include_limited_units \u0026\u0026 coupon.include_time_limitation \u0026\u0026 scarcityCouponTimer\u0022\u003E\r\n              There are only \u003Cb\u003E{{ coupon.unit }}\u003C\/b\u003E promo codes left and\r\n              \u003Cb\u003E\r\n                \u003Cspan v-if=\u0022scarcityCouponTimer.days \u003E 0\u0022\u003E{{ scarcityCouponTimer.days }}d: \u003C\/span\u003E{{ scarcityCouponTimer.hours }}h: {{ scarcityCouponTimer.minutes }}m: {{ scarcityCouponTimer.seconds }}s\r\n              \u003C\/b\u003E\r\n              left, please submit soon.\r\n            \u003C\/span\u003E\r\n        \u003C\/p\u003E\r\n        \u003Cdiv class=\u0022split-coupon-input\u0022\u003E\r\n          \u003Cinput\r\n              type=\u0022text\u0022\r\n              class=\u0022split-input\u0022\r\n              placeholder=\u0022Discount code or gift card\u0022\r\n              v-model=\u0022couponCode\u0022\r\n              @keyup.enter=\u0022checkCouponCode\u0022\r\n          \/\u003E\r\n          \u003Cbutton\r\n              type=\u0022button\u0022\r\n              class=\u0022split-coupon-apply\u0022\r\n              :class=\u0022{ \u0027is-applied\u0027: couponChecked \u0026\u0026 !isCouponInvalid }\u0022\r\n              @click=\u0022checkCouponCode\u0022\r\n          \u003EApply\u003C\/button\u003E\r\n        \u003C\/div\u003E\r\n        \u003Cdiv class=\u0022split-coupon-success\u0022 v-if=\u0022couponChecked \u0026\u0026 !isCouponInvalid\u0022\u003E\r\n          Coupon applied successfully, you saved ${{ couponDiscount.toFixed(2) }}\r\n        \u003C\/div\u003E\r\n        \u003Cdiv class=\u0022split-coupon-error\u0022 v-if=\u0022couponChecked \u0026\u0026 isCouponInvalid\u0022\u003EInvalid coupon\u003C\/div\u003E\r\n      \u003C\/div\u003E\r\n\r\n      \u003C!-- Text Offers (uses the phone above; consent only) --\u003E\r\n      \u003Cdiv class=\u0022split-text-offers\u0022 v-if=\u0022orderFormSetting.phone \u0026\u0026 orderFormSetting.phone.is_show\u0022\u003E\r\n        \u003Ch3 class=\u0022split-subsection-head\u0022\u003EText offers\u003C\/h3\u003E\r\n        \u003Cp class=\u0022split-text-offers-caption\u0022\u003EStay in touch \u0026mdash; tap subscribe to opt in to text alerts using the phone above.\u003C\/p\u003E\r\n        \u003Cbutton type=\u0022button\u0022 class=\u0022split-subscribe-btn\u0022 @click=\u0022isSubscribed = true\u0022\u003E\r\n          {{ isSubscribed ? \u0027Subscribed\u0027 : \u0027Subscribe*\u0027 }}\r\n        \u003C\/button\u003E\r\n        \u003Cp class=\u0022split-text-offers-disc\u0022\u003E\r\n          *By subscribing, you agree to receive recurring automated marketing text messages.\r\n          Msg \u0026amp; data rates may apply. Reply HELP for help and STOP to cancel.\r\n        \u003C\/p\u003E\r\n      \u003C\/div\u003E\r\n\r\n      \u003C!-- Inline Order Summary --\u003E\r\n      \u003Cdiv class=\u0022split-summary\u0022 @click.stop=\u0022setSetting(\u0027main\u0027)\u0022\u003E\r\n        \u003Cdiv class=\u0022split-summary-line split-summary-main\u0022\u003E\r\n          \u003Cspan class=\u0022split-summary-title\u0022\u003E{{ orderFormSetting.product ? orderFormSetting.product.name : \u0027Your Product\u0027 }}\u003C\/span\u003E\r\n          \u003Cdel v-if=\u0022subTotal \u0026\u0026 productPrice \u0026\u0026 subTotal \u003C productPrice\u0022 class=\u0022split-summary-price split-summary-strike\u0022\u003E${{ productPrice.toFixed(2) }}\u003C\/del\u003E\r\n          \u003Cspan v-else class=\u0022split-summary-price\u0022\u003E${{ productPrice ? productPrice.toFixed(2) : \u00270.00\u0027 }}\u003C\/span\u003E\r\n        \u003C\/div\u003E\r\n\r\n        \u003Cdiv\r\n            class=\u0022split-summary-line\u0022\r\n            v-if=\u0022scarcitySetting \u0026\u0026 scarcitySetting.scarcity_type == \u0027special_discount\u0027 \u0026\u0026 discount \u0026\u0026 discount.id \u0026\u0026 discountTimer \u0026\u0026 !discountTimerExpired\u0022\r\n        \u003E\r\n          \u003Cspan class=\u0022split-summary-title\u0022\u003ESpecial discount\u003C\/span\u003E\r\n          \u003Cspan class=\u0022split-summary-price split-summary-discount\u0022\u003E\u0026minus;${{ discountedPrice.toFixed(2) }}\u003C\/span\u003E\r\n        \u003C\/div\u003E\r\n\r\n        \u003Cdiv class=\u0022split-summary-line\u0022 v-if=\u0022couponDiscount \u0026\u0026 couponDiscount \u003E 0\u0022\u003E\r\n          \u003Cspan class=\u0022split-summary-title\u0022\u003ECoupon discount\u003C\/span\u003E\r\n          \u003Cspan class=\u0022split-summary-price split-summary-discount\u0022\u003E\u0026minus;${{ couponDiscount.toFixed(2) }}\u003C\/span\u003E\r\n        \u003C\/div\u003E\r\n\r\n        \u003Cdiv\r\n            class=\u0022split-summary-line\u0022\r\n            v-for=\u0022(bump, biIndex) in usedBumpDetails\u0022\r\n            :key=\u0022\u0027bump-\u0027 + biIndex\u0022\r\n        \u003E\r\n          \u003Cspan class=\u0022split-summary-title\u0022\u003E{{ bump.bump_product_name || bump.name }}\u003C\/span\u003E\r\n          \u003Cspan class=\u0022split-summary-price\u0022\u003E${{ bump.bump_product_price ? Number(bump.bump_product_price).toFixed(2) : \u00270.00\u0027 }}\u003C\/span\u003E\r\n        \u003C\/div\u003E\r\n\r\n        \u003Cdiv class=\u0022split-summary-line split-summary-subtle\u0022\u003E\r\n          \u003Cspan class=\u0022split-summary-title\u0022\u003ESubtotal\u003C\/span\u003E\r\n          \u003Cspan class=\u0022split-summary-price\u0022\u003E${{ subTotal ? subTotal.toFixed(2) : \u00270.00\u0027 }}\u003C\/span\u003E\r\n        \u003C\/div\u003E\r\n\r\n        \u003Cdiv class=\u0022split-summary-line split-summary-subtle\u0022\u003E\r\n          \u003Cspan class=\u0022split-summary-title\u0022\u003EShipping\u003C\/span\u003E\r\n          \u003Cspan class=\u0022split-summary-price\u0022\u003E{{ shippingCharge \u003E 0 ? \u0027$\u0027 + shippingCharge.toFixed(2) : \u0027FREE\u0027 }}\u003C\/span\u003E\r\n        \u003C\/div\u003E\r\n\r\n        \u003Cdiv class=\u0022split-summary-line split-summary-subtle\u0022\u003E\r\n          \u003Cspan class=\u0022split-summary-title\u0022\u003ESales tax\u003C\/span\u003E\r\n          \u003Cspan class=\u0022split-summary-price\u0022\u003E$0.00\u003C\/span\u003E\r\n        \u003C\/div\u003E\r\n\r\n        \u003Cdiv class=\u0022split-summary-line split-summary-total\u0022\u003E\r\n          \u003Cspan class=\u0022split-summary-title\u0022\u003ETotal\u003C\/span\u003E\r\n          \u003Cspan class=\u0022split-summary-price\u0022\u003E\r\n              \u003Cspan class=\u0022split-summary-currency\u0022\u003EUSD\u003C\/span\u003E\r\n              ${{ totalCartValue ? totalCartValue.toFixed(2) : \u00270.00\u0027 }}\r\n            \u003C\/span\u003E\r\n        \u003C\/div\u003E\r\n      \u003C\/div\u003E\r\n\r\n      \u003C!-- CTA --\u003E\r\n      \u003Cbutton\r\n          type=\u0022button\u0022\r\n          class=\u0022split-cta\u0022\r\n          :disabled=\u0022loader\u0022\r\n          @click=\u0022!isEditorMode ? singleStepOrder() : null\u0022\r\n      \u003E\r\n          \u003Cspan v-if=\u0022!loader\u0022\u003E\r\n            \u003Cspan class=\u0022split-cta-lock\u0022\u003E\r\n              \u003Csvg width=\u002214\u0022 height=\u002214\u0022 viewBox=\u00220 0 24 24\u0022 fill=\u0022none\u0022 xmlns=\u0022http:\/\/www.w3.org\/2000\/svg\u0022\u003E\r\n                \u003Crect x=\u00224\u0022 y=\u002210\u0022 width=\u002216\u0022 height=\u002211\u0022 rx=\u00222\u0022 stroke=\u0022currentColor\u0022 stroke-width=\u00222\u0022\/\u003E\r\n                \u003Cpath d=\u0022M8 10V7a4 4 0 0 1 8 0v3\u0022 stroke=\u0022currentColor\u0022 stroke-width=\u00222\u0022 stroke-linecap=\u0022round\u0022\/\u003E\r\n              \u003C\/svg\u003E\r\n            \u003C\/span\u003E\r\n            Complete Order \u0026mdash; ${{ totalCartValue ? totalCartValue.toFixed(2) : \u00270.00\u0027 }}\r\n          \u003C\/span\u003E\r\n        \u003Cspan class=\u0022split-spinner\u0022 v-else\u003E\u003C\/span\u003E\r\n      \u003C\/button\u003E\r\n    \u003C\/div\u003E\r\n\r\n  \u003C\/div\u003E\r\n\r\n  \u003C!-- ============ BRAND FOOTER ============ --\u003E\r\n  \u003Cdiv class=\u0022split-brands-footer\u0022\u003E\r\n    \u003Cspan class=\u0022split-cc-pill\u0022\u003EVISA\u003C\/span\u003E\r\n    \u003Cspan class=\u0022split-cc-pill\u0022\u003EMC\u003C\/span\u003E\r\n    \u003Cspan class=\u0022split-cc-pill\u0022\u003EDISC\u003C\/span\u003E\r\n    \u003Cspan class=\u0022split-cc-pill\u0022\u003EAMEX\u003C\/span\u003E\r\n    \u003Cspan class=\u0022split-cc-pill\u0022\u003EDIN\u003C\/span\u003E\r\n  \u003C\/div\u003E\r\n\r\n\u003C\/div\u003E\r\n\u003C\/section\u003E","style":"html,body {\r\nmargin: 0;\r\npadding: 0;\r\n}\r\n\r\n.split-checkout {\r\n\/* --- Eclipse defaults (overridden by :style=\u0022paletteVars()\u0022 at render time) --- *\/\r\n--palette-bg: #07090f;\r\n--palette-bg-2: #11141d;\r\n--palette-panel: #15192a;\r\n--palette-panel-2: #1d2133;\r\n--palette-input-bg: #0a0d16;\r\n--palette-input-border: #1e2233;\r\n--palette-text: #eaecf2;\r\n--palette-text-dim: #a0a5b8;\r\n--palette-text-mute: #6a7085;\r\n--palette-primary: #c4c9d6;\r\n--palette-primary-hover: #d4d9e4;\r\n--palette-primary-press: #b4b9c8;\r\n--palette-secondary: #8f95a8;\r\n--palette-accent: #d9b863;\r\n--palette-urgency: #e04a4a;\r\n--palette-success: #4ade80;\r\n--palette-danger: #e04a4a;\r\n\r\n\/* sizing tokens *\/\r\n--split-card-radius: 18px;\r\n--split-card-pad: 36px;\r\n--split-input-radius: 10px;\r\n\r\nbackground: var(--palette-bg);\r\ncolor: var(--palette-text);\r\nmin-height: 100vh;\r\npadding: 0 0 56px;\r\nfont: 15px\/1.5 \u0027Inter\u0027, -apple-system, BlinkMacSystemFont, \u0027Segoe UI\u0027, Roboto, sans-serif;\r\n-webkit-font-smoothing: antialiased;\r\n-moz-osx-font-smoothing: grayscale;\r\n}\r\n\r\n.split-checkout * {\r\nbox-sizing: border-box;\r\n}\r\n\r\n\/* ============ SCARCITY BANNER (full-width above grid) ============ *\/\r\n.split-checkout .split-scarcity-banner {\r\nbackground:\r\nlinear-gradient(\r\n90deg,\r\ncolor-mix(in oklch, var(--palette-urgency) 28%, var(--palette-bg)),\r\ncolor-mix(in oklch, var(--palette-urgency) 15%, var(--palette-bg))\r\n);\r\nborder-bottom: 1px solid color-mix(in oklch, var(--palette-urgency) 30%, var(--palette-input-border));\r\n}\r\n\r\n.split-checkout .split-scarcity-inner {\r\nmax-width: 1180px;\r\nmargin: 0 auto;\r\npadding: 14px 24px;\r\ndisplay: flex;\r\nalign-items: center;\r\ngap: 18px;\r\nflex-wrap: wrap;\r\n}\r\n\r\n.split-checkout .split-scarcity-badge {\r\ndisplay: inline-flex;\r\nalign-items: center;\r\ngap: 6px;\r\nbackground: color-mix(in oklch, var(--palette-urgency) 30%, var(--palette-bg));\r\ncolor: var(--palette-text);\r\nfont-size: 11px;\r\nfont-weight: 800;\r\ntext-transform: uppercase;\r\nletter-spacing: 0.08em;\r\npadding: 6px 12px;\r\nborder-radius: 999px;\r\nflex-shrink: 0;\r\nborder: 1px solid color-mix(in oklch, var(--palette-urgency) 50%, transparent);\r\n}\r\n\r\n.split-checkout .split-scarcity-bolt {\r\nfont-size: 13px;\r\nline-height: 1;\r\n}\r\n\r\n.split-checkout .split-scarcity-body {\r\nfont-size: 13px;\r\ncolor: var(--palette-text);\r\nline-height: 1.5;\r\n}\r\n\r\n.split-checkout .split-scarcity-body strong {\r\nfont-weight: 700;\r\nmargin-right: 4px;\r\n}\r\n\r\n.split-checkout .split-scarcity-body b {\r\ncolor: var(--palette-urgency);\r\nfont-weight: 700;\r\n}\r\n\r\n.split-checkout .split-scarcity-sep {\r\ncolor: var(--palette-text-mute);\r\nmargin: 0 6px;\r\n}\r\n\r\n\/* ============ SHELL + GRID ============ *\/\r\n.split-checkout .split-shell {\r\nmax-width: 1180px;\r\nmargin: 0 auto;\r\npadding: 32px 24px 0;\r\n}\r\n\r\n.split-checkout .split-split {\r\ndisplay: grid;\r\ngrid-template-columns: 1fr 1.15fr;\r\ngap: 24px;\r\nalign-items: start;\r\n}\r\n\r\n\/* ============ LEFT COLUMN \u2014 sticky wrapper for hero + testimonials ============\r\nThe wrapper is the sticky element. Hero and testimonials inside scroll\r\ntogether as one unit and stay pinned to top: 24px on desktop. *\/\r\n.split-checkout .split-left-col {\r\ndisplay: flex;\r\nflex-direction: column;\r\ngap: 16px;\r\nposition: sticky;\r\ntop: 24px;\r\nalign-self: start;\r\n}\r\n\r\n\/* ============ LEFT: HERO PANEL ============ *\/\r\n.split-checkout .split-hero {\r\nbackground:\r\nradial-gradient(\r\ncircle at 0% 0%,\r\ncolor-mix(in oklch, var(--palette-primary) 22%, transparent),\r\ntransparent 55%\r\n),\r\nradial-gradient(\r\ncircle at 100% 100%,\r\ncolor-mix(in oklch, var(--palette-secondary) 14%, transparent),\r\ntransparent 45%\r\n),\r\nvar(--palette-bg-2);\r\nborder: 1px solid var(--palette-input-border);\r\nborder-radius: var(--split-card-radius);\r\npadding: var(--split-card-pad);\r\ndisplay: flex;\r\nflex-direction: column;\r\nalign-items: flex-start;\r\noverflow: hidden;\r\n}\r\n\r\n.split-checkout .split-logo-input { display: none; }\r\n.split-checkout .split-logo {\r\ndisplay: block;\r\nmax-height: 58px;\r\nwidth: auto;\r\nobject-fit: contain;\r\nmargin: 0 0 16px;\r\ncursor: pointer;\r\n}\r\n\r\n.split-checkout .split-hero-pill {\r\ndisplay: inline-block;\r\nfont-size: 10px;\r\nfont-weight: 800;\ \ncursor: not-allowed;\r\n}\r\n\r\n.split-checkout .split-cta span {\r\ndisplay: inline-flex;\r\nalign-items: center;\r\ngap: 8px;\r\n}\r\n\r\n.split-checkout .split-cta-lock {\r\ndisplay: inline-flex;\r\nalign-items: center;\r\n}\r\n\r\n.split-checkout .split-spinner {\r\nwidth: 22px;\r\nheight: 22px;\r\nborder: 2.5px solid color-mix(in oklch, var(--palette-bg) 40%, transparent);\r\nborder-top-color: var(--palette-bg);\r\nborder-radius: 50%;\r\ndisplay: inline-block;\r\nanimation: split-spin 0.7s linear infinite;\r\n}\r\n\r\n@keyframes split-spin {\r\nfrom { transform: rotate(0deg); }\r\nto   { transform: rotate(360deg); }\r\n}\r\n\r\n\/* ============ SHAKE ============ *\/\r\n.split-checkout .split-shake {\r\nanimation: split-shake 0.35s cubic-bezier(.36,.07,.19,.97) both;\r\n}\r\n\r\n@keyframes split-shake {\r\n10%, 90% { transform: translate3d(-1px, 0, 0); }\r\n20%, 80% { transform: translate3d(2px, 0, 0); }\r\n30%, 50%, 70% { transform: translate3d(-3px, 0, 0); }\r\n40%, 60% { transform: translate3d(3px, 0, 0); }\r\n}\r\n\r\n\/* ============ TESTIMONIALS \u2014 left column, row 2 (under hero card) ============\r\nImplicit placement: with .split-split as a 2-col grid and three children\r\n(hero, form, testimonials), testimonials fall into row 2 col 1, sitting\r\ndirectly below the hero. On mobile the grid collapses to one column and\r\nthey land at the bottom in DOM order. *\/\r\n.split-checkout .split-testimonials {\r\ndisplay: flex;\r\nflex-direction: column;\r\ngap: 16px;\r\n}\r\n\r\n.split-checkout .split-testimonial {\r\nbackground: var(--palette-bg-2);\r\nborder: 1px solid var(--palette-input-border);\r\nborder-radius: var(--split-card-radius);\r\npadding: 24px;\r\n}\r\n\r\n.split-checkout .split-testimonial-head {\r\ndisplay: flex;\r\nalign-items: center;\r\ngap: 12px;\r\nmargin-bottom: 14px;\r\n}\r\n\r\n.split-checkout .split-testimonial-avatar {\r\nwidth: 44px;\r\nheight: 44px;\r\nborder-radius: 50%;\r\nobject-fit: cover;\r\nbackground: color-mix(in okl
