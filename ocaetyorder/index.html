<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Congratulazioni — OpenClaw Activation Experience</title>
  <meta name="robots" content="noindex,nofollow" />
  <style>
    :root {
      --primary: #00d4ff;
      --bg: #07080d;
      --bg-alt: #0d1018;
      --text: #eef4ff;
      --muted: #98a2b7;
      --border: rgba(0, 212, 255, 0.16);
      --shadow: 0 25px 80px rgba(0,0,0,.45);
      --hero-grad: linear-gradient(180deg, #07080d 0%, #0b0f18 45%, #07111a 75%, #07080d 100%);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }
    img { display: block; max-width: 100%; }
    .hero {
      min-height: 100vh;
      padding: 48px 20px 64px;
      background: var(--hero-grad);
      position: relative;
      overflow: hidden;
    }
    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 50% 18%, rgba(0,212,255,.12), transparent 30%),
        radial-gradient(circle at 85% 25%, rgba(124,58,237,.12), transparent 18%),
        radial-gradient(circle at 10% 35%, rgba(0,212,255,.08), transparent 16%);
      pointer-events: none;
    }
    .container {
      width: min(980px, 100%);
      margin: 0 auto;
      position: relative;
      z-index: 1;
      text-align: center;
    }
    .eyebrow {
      display: inline-block;
      margin-bottom: 18px;
      padding: 8px 14px;
      border: 1px solid rgba(0,212,255,.2);
      border-radius: 999px;
      color: var(--primary);
      background: rgba(0,212,255,.07);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 auto 18px;
      max-width: 820px;
      font-size: clamp(2.2rem, 5vw, 4rem);
      line-height: 1.06;
      letter-spacing: -.04em;
      font-weight: 900;
    }
    .message {
      margin: 28px auto 0;
      max-width: 760px;
      font-size: clamp(1.05rem, 1.8vw, 1.24rem);
      color: var(--muted);
    }
    .hero-visual {
      display: flex;
      justify-content: center;
      margin: 34px auto 0;
    }
    .hero-card {
      width: min(920px, 100%);
      border: 1px solid var(--border);
      border-radius: 22px;
      overflow: hidden;
      background: rgba(255,255,255,.02);
      box-shadow: var(--shadow);
    }
    .hero-card::after {
      content: "";
      position: absolute;
      inset: auto 0 0 0;
      height: 30%;
      background: linear-gradient(180deg, rgba(0,0,0,0), rgba(0,0,0,.38));
      pointer-events: none;
    }
    .hero-card {
      position: relative;
    }
    @media (max-width: 640px) {
      .hero {
        padding: 36px 16px 48px;
      }
      .message {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <main class="hero">
    <div class="container">
      <div class="eyebrow">OpenClaw Activation Experience</div>
      <h1>Congratulazioni per aver effettuato l'accesso a OpenClaw Activation Experience</h1>

      <div class="hero-visual">
        <div class="hero-card">
          <img src="/ocae/hero.jpg" alt="OpenClaw Activation Experience hero image" />
        </div>
      </div>

      <p class="message">Riceverai tutte le istruzioni nella tua casella di posta. Assicurati di aver messo in white list la mail ciao@riccardoromano.biz</p>
    </div>
  </main>
</body>
</html>
