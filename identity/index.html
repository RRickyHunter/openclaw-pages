<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IDENTITY.md Builder</title>
  <meta name="description" content="Definisci l'identità del tuo bot" />
  <style>
    :root {
      --bg: #0b1020;
      --panel: #131a2e;
      --panel-2: #1a223c;
      --text: #eef2ff;
      --muted: #aeb8d4;
      --accent: #f59e0b;
      --accent-2: #ef4444;
      --border: rgba(255,255,255,.08);
      --shadow: 0 20px 60px rgba(0,0,0,.35);
    }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; background: radial-gradient(circle at top, rgba(245,158,11,.16), transparent 34%), linear-gradient(180deg, #1a1208, #120d09 55%, #0d0a09); color:var(--text); min-height:100vh; }
    .container { width:min(1120px, calc(100% - 32px)); margin:0 auto; padding:40px 0 60px; }
    .header { text-align:center; margin-bottom:30px; }
    .emoji-badge { width:auto; height:auto; margin:0 auto 18px; display:grid; place-items:center; font-size:64px; background:transparent; border:0; box-shadow:none; animation:floatGhost 2.2s ease-in-out infinite; line-height:1; }
    @keyframes floatGhost { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
    h1 { margin:0 0 14px; font-size:clamp(40px, 5.2vw, 62px); line-height:1.02; color:#ffd089; letter-spacing:-0.03em; }
    .subtitle { margin:0; color:var(--muted); font-size:clamp(20px, 2.4vw, 28px); line-height:1.35; }
    .intro-box { margin:28px auto 34px; padding:24px 28px; background:linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.025)); border:1px solid var(--border); border-radius:22px; box-shadow:var(--shadow); max-width:100%; }
    .intro-box p { margin:0; color:#dce3fb; font-size:clamp(18px, 2vw, 24px); line-height:1.5; }
    .mode-selector { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:18px; }
    .mode-card, .question-card, .result, .steps-box { background:linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.02)); border:1px solid var(--border); border-radius:22px; box-shadow:var(--shadow); }
    .mode-card { padding:24px; cursor:pointer; transition:.18s ease; min-height:220px; display:flex; flex-direction:column; }
    .mode-card:hover { transform:translateY(-3px); border-color:rgba(245,158,11,.45); }
    .mode-icon { font-size:38px; margin-bottom:16px; line-height:1; }
    .mode-card h3 { margin:0 0 10px; font-size:24px; }
    .mode-card p { margin:0 0 16px; color:var(--muted); line-height:1.5; }
    .mode-meta { margin-top:auto; display:flex; gap:12px; flex-wrap:wrap; color:#d7def5; font-size:14px; }
    .meta-item { padding:8px 12px; border-radius:999px; background:rgba(255,255,255,.05); border:1px solid var(--border); }
    .back-button, .button { appearance:none; border:0; cursor:pointer; color:var(--text); background:linear-gradient(180deg, #f59e0b, #dc2626); border-radius:14px; padding:14px 18px; font-size:15px; font-weight:700; box-shadow:var(--shadow); }
    .back-button { background:rgba(255,255,255,.08); margin-bottom:24px; }
    .questions-container { max-width:760px; margin:0 auto; }
    .progress-bar { width:100%; height:12px; background:rgba(255,255,255,.08); border-radius:999px; overflow:hidden; margin-bottom:14px; }
    .progress-fill { height:100%; background:linear-gradient(90deg, #f59e0b, #ef4444); }
    .progress-text { color:var(--muted); margin:0 0 18px; text-align:center; }
    .question-card { padding:28px; }
    .question-card h2 { margin:0 0 12px; font-size:30px; }
    .question-card label { display:block; margin-bottom:14px; color:var(--muted); line-height:1.5; }
    textarea, select { width:100%; border-radius:16px; border:1px solid var(--border); background:var(--panel-2); color:var(--text); padding:16px 18px; font:inherit; }
    textarea { min-height:160px; resize:vertical; }
    .actions { display:flex; justify-content:space-between; gap:12px; margin-top:18px; }
    .button.secondary { background:rgba(255,255,255,.08); }
    .result { padding:28px; }
    .result pre, .copy-box pre { white-space:pre-wrap; word-break:break-word; background:#0a1020; border:1px solid var(--border); border-radius:18px; padding:20px; color:#dfe7ff; overflow:auto; }
    .steps-box { padding:24px; margin-top:20px; }
    .steps-box h3 { margin-top:0; }
    .steps-box ol { margin:0; padding-left:20px; color:var(--muted); line-height:1.7; }
    .download-button, .copy-button { width:100%; margin-top:18px; }
    .copy-box { margin-top:20px; background:#0a1020; border:1px solid var(--border); border-radius:18px; padding:20px; }
    .copy-box p { margin:0 0 12px; color:#dce3fb; font-weight:700; }
    @media (max-width:860px){ .mode-selector{grid-template-columns:1fr;} }
  </style>
</head>
<body>
<div id="app"></div>
<script>
const modes=[
{id:'quick',icon:'✨',name:'Avvio Rapido',description:'Per creare un’identità chiara e immediata.',time:'2 min',questions:4},
{id:'complete',icon:'🎭',name:'Completa',description:'Per definire un’identità più forte, utile e coerente.',time:'5 min',questions:7},
{id:'detailed',icon:'👑',name:'Dettagliata',description:'Per creare un’identità distintiva, precisa e molto personalizzata.',time:'10 min',questions:15}
];
const questions=[
{id:'name',title:'Come si chiama il tuo bot?',label:'Scegli un nome che senti adatto alla sua presenza.',placeholder:'Esempio: Selen, Atlas, Nox, Vera, Orione',type:'textarea',modes:['quick','complete','detailed']},
{id:'quickRole',title:'Che ruolo deve avere per te?',label:'Qual è la sua funzione principale?',type:'select',options:['Assistente operativo','Partner di lavoro','Organizzatore personale','Stratega di supporto','Braccio destro esecutivo'],modes:['quick']},
{id:'quickPresence',title:'Che tipo di presenza deve trasmettere?',label:'Come vuoi percepirlo quando lo usi?',type:'select',options:['Professionale e affidabile','Umana e vicina','Lucida e strategica','Forte e autorevole','Calma e rassicurante'],modes:['quick']},
{id:'quickWho',title:'In una frase: chi deve essere questo bot per te?',label:'Una definizione semplice ma forte.',placeholder:'Esempio: un partner operativo che mi aiuta a fare chiarezza e portare avanti il lavoro senza dispersione.',type:'textarea',modes:['quick']},
{id:'roleInLife',title:'Che ruolo deve avere nella tua vita o nel tuo lavoro?',label:'Descrivilo in modo semplice e concreto.',placeholder:'Esempio: partner operativo, coordinatore, guida esecutiva, supporto strategico concreto.',type:'textarea',modes:['complete']},
{id:'positionVsYou',title:'Come vuoi che si posizioni rispetto a te?',label:'Che tipo di relazione deve avere con te?',type:'select',options:['Assistente che esegue','Collaboratore alla pari','Braccio destro fidato','Presenza di supporto e guida','Figura autonoma ma allineata'],modes:['complete']},
{id:'firstImpression',title:'Che impressione deve dare fin dal primo messaggio?',label:'Che sensazione deve trasmettere subito?',placeholder:'Esempio: solidità, intelligenza, chiarezza, zero fuffa, presenza vera.',type:'textarea',modes:['complete']},
{id:'dominantQuality',title:'Che qualità deve incarnare di più?',label:'Scegli la qualità dominante.',type:'select',options:['Affidabilità','Chiarezza','Precisione','Calore umano','Autorevolezza','Concretezza','Visione'],modes:['complete']},
{id:'neverSeem',title:'Cosa non deve sembrare mai?',label:'Definisci la percezione da evitare.',placeholder:'Esempio: un bot generico, un motivatore finto, un segretario passivo, un robot freddo, un tecnico scolastico.',type:'textarea',modes:['complete']},
{id:'figureDesc',title:'Se dovessi descriverlo come una figura, chi è?',label:'Una figura simbolica, professionale o archetipica.',placeholder:'Esempio: una consigliera lucida, un capo di gabinetto operativo, una presenza silenziosa ma forte, un architetto di ordine.',type:'textarea',modes:['complete']},
{id:'nameWhy',title:'Perché questo nome è giusto per lui?',label:'Che significato o energia porta con sé?',placeholder:'Esempio: richiama una presenza luminosa, discreta, intelligente, capace di guidare senza invadere.',type:'textarea',modes:['detailed']},
{id:'preciseFigure',title:'Se fosse una figura precisa, chi sarebbe?',label:'Descrivi la figura che incarna.',placeholder:'Esempio: una guida operativa, una consigliera strategica, un guardiano dell’ordine, una mente di supporto.',type:'textarea',modes:['detailed']},
{id:'realRole',title:'Qual è il suo ruolo reale nel tuo ecosistema?',label:'Descrivilo in modo chiaro.',placeholder:'Esempio: aiutarmi a trasformare visione in esecuzione, ridurre attrito, aumentare chiarezza e continuità.',type:'textarea',modes:['detailed']},
{id:'positionDetailed',title:'Come deve posizionarsi rispetto a te?',label:'Che distanza o prossimità deve avere?',placeholder:'Esempio: vicino ma non invadente, presente ma non dominante, capace di iniziativa ma sempre allineato.',type:'textarea',modes:['detailed']},
{id:'symbolicAuthority',title:'Che grado di autorità simbolica vuoi che abbia?',label:'Scegli la sua presenza simbolica.',type:'select',options:['Presenza leggera','Supporto autorevole','Braccio destro forte','Figura direttiva ma al servizio','Presenza quasi istituzionale'],modes:['detailed']},
{id:'leaveFeeling',title:'Che sensazione deve lasciare quando appare?',label:'Che effetto deve produrre subito?',placeholder:'Esempio: ordine, lucidità, presenza, calma, affidabilità, spinta all’azione.',type:'textarea',modes:['detailed']},
{id:'representQuality',title:'Quale qualità deve rappresentare più di tutte?',label:'Indica la qualità guida.',placeholder:'Esempio: chiarezza, affidabilità, profondità, stabilità, forza tranquilla.',type:'textarea',modes:['detailed']},
{id:'identityEnergy',title:'Che energia deve avere?',label:'Scegli l’energia dominante.',type:'select',options:['Calma','Lucida','Solida','Elegante','Intensa','Essenziale','Protettiva'],modes:['detailed']},
{id:'relationshipType',title:'Che tipo di rapporto deve avere con te?',label:'Descrivi la qualità del rapporto.',placeholder:'Esempio: rapporto di fiducia, collaborazione, sincerità, supporto reale e continuità.',type:'textarea',modes:['detailed']},
{id:'understandYou',title:'Cosa deve capire profondamente di te?',label:'Quali aspetti deve interiorizzare?',placeholder:'Esempio: che non voglio perdere tempo, che cerco struttura, che mi serve chiarezza più che motivazione.',type:'textarea',modes:['detailed']},
{id:'alwaysRemember',title:'Quando ti rivolgi a lui, cosa deve ricordarsi sempre?',label:'Quale punto non deve perdere di vista?',placeholder:'Esempio: che deve aiutarmi a muovere le cose avanti, proteggere il focus e ridurre attrito.',type:'textarea',modes:['detailed']},
{id:'antiPresence',title:'Che tipo di presenza non vuoi assolutamente?',label:'Definisci l’anti-identità.',placeholder:'Esempio: servile, vuota, scolastica, fredda, eccessivamente artificiale, passiva.',type:'textarea',modes:['detailed']},
{id:'wrongAtSight',title:'Cosa lo renderebbe subito “sbagliato” ai tuoi occhi?',label:'Quale segnale lo renderebbe fuori tono?',placeholder:'Esempio: parlare in modo generico, sembrare finto, fare il simpatico a caso, sembrare un tool invece che una presenza.',type:'textarea',modes:['detailed']},
{id:'identitySentence',title:'Se dovessi riassumere la sua identità in una frase finale, quale sarebbe?',label:'Una frase chiusa e forte.',placeholder:'Esempio: una presenza operativa intelligente, solida e umana, creata per aiutarmi a costruire senza dispersione.',type:'textarea',modes:['detailed']}
];
let state={mode:null,step:0,answers:{}}; const app=document.getElementById('app');
const qsForMode=()=>questions.filter(q=>q.modes.includes(state.mode));
function buildIdentity(){ const a=state.answers; const lines=[]; const pushSection=(title,items)=>{ const valid=items.filter(Boolean); if(!valid.length)return; if(lines.length)lines.push(''); lines.push(title); valid.forEach(i=>lines.push(i)); }; lines.push('# IDENTITY.md'); pushSection('## Identità di Base',[a.name?`- Nome: ${a.name}`:'',a.quickWho?`- Definizione sintetica: ${a.quickWho}`:'',a.identitySentence?`- Sintesi finale: ${a.identitySentence}`:'']); pushSection('## Ruolo',[a.quickRole?`- Ruolo: ${a.quickRole}.`:'',a.roleInLife?`- Ruolo nel lavoro/vita: ${a.roleInLife}`:'',a.realRole?`- Ruolo reale nell’ecosistema: ${a.realRole}`:'']); pushSection('## Presenza e Posizionamento',[a.quickPresence?`- Presenza percepita: ${a.quickPresence}.`:'',a.positionVsYou?`- Posizionamento rispetto all’utente: ${a.positionVsYou}.`:'',a.positionDetailed?`- Posizionamento dettagliato: ${a.positionDetailed}`:'',a.symbolicAuthority?`- Autorità simbolica: ${a.symbolicAuthority}.`:'',a.firstImpression?`- Prima impressione desiderata: ${a.firstImpression}`:'',a.leaveFeeling?`- Sensazione che deve lasciare: ${a.leaveFeeling}`:'']); pushSection('## Qualità e Figura',[a.dominantQuality?`- Qualità dominante: ${a.dominantQuality}.`:'',a.representQuality?`- Qualità che deve rappresentare: ${a.representQuality}`:'',a.figureDesc?`- Figura archetipica: ${a.figureDesc}`:'',a.preciseFigure?`- Figura precisa: ${a.preciseFigure}`:'',a.identityEnergy?`- Energia: ${a.identityEnergy}.`:'',a.nameWhy?`- Perché questo nome è giusto: ${a.nameWhy}`:'']); pushSection('## Relazione con l’Utente',[a.relationshipType?`- Tipo di rapporto: ${a.relationshipType}`:'',a.understandYou?`- Cosa deve capire profondamente dell’utente: ${a.understandYou}`:'',a.alwaysRemember?`- Cosa deve ricordarsi sempre: ${a.alwaysRemember}`:'']); pushSection('## Anti-Identità',[a.neverSeem?`- Non deve sembrare mai: ${a.neverSeem}`:'',a.antiPresence?`- Presenza da evitare: ${a.antiPresence}`:'',a.wrongAtSight?`- Cosa lo renderebbe subito sbagliato: ${a.wrongAtSight}`:'']); return lines.join('\n'); }
function download(content,filename){ const a=document.createElement('a'); const blob=new Blob([content],{type:'text/markdown'}); a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(a.href); }
function renderHome(){ app.innerHTML=`<div class="container"><div class="header"><div class="emoji-badge" aria-hidden="true"><svg viewBox="0 0 64 64" width="74" height="74" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M32 8c-8.8 0-16 7.2-16 16 0 11.2 10.2 18.7 14.9 21.7.7.4 1.5.4 2.2 0C37.8 42.7 48 35.2 48 24c0-8.8-7.2-16-16-16Z" fill="rgba(255,208,137,0.9)"/><circle cx="26" cy="24" r="3.5" fill="#1a1208"/><circle cx="38" cy="24" r="3.5" fill="#1a1208"/><path d="M25 33c2.5 2.6 11.5 2.6 14 0" stroke="#1a1208" stroke-width="3" stroke-linecap="round"/></svg></div><h1>Definisci l’identità del tuo bot</h1><p class="subtitle">Scegli chi è, che ruolo ha e che tipo di presenza deve incarnare nel tuo lavoro.</p></div><div class="intro-box"><p>Scegli la modalità più adatta al livello di profondità che vuoi dare al tuo bot: rapida se vuoi una base immediata, completa se vuoi un’identità più forte, dettagliata se vuoi definire con precisione nome, presenza, ruolo e relazione.</p></div><div class="mode-selector">${modes.map(m=>`<div class="mode-card" data-mode="${m.id}"><span class="mode-icon">${m.icon}</span><h3>${m.name}</h3><p>${m.description}</p><div class="mode-meta"><span class="meta-item">⏱️ ${m.time}</span><span class="meta-item">❓ ${m.questions} domande</span></div></div>`).join('')}</div></div>`; document.querySelectorAll('.mode-card').forEach(el=>el.addEventListener('click',()=>{state.mode=el.dataset.mode; state.step=0; renderQuestion();})); }
function renderQuestion(){ const list=qsForMode(); const q=list[state.step]; const progress=((state.step+1)/list.length)*100; const control=q.type==='select'?`<select id="input">${q.options.map(o=>`<option value="${o}" ${state.answers[q.id]===o?'selected':''}>${o}</option>`).join('')}</select>`:`<textarea id="input" placeholder="${q.placeholder||''}">${state.answers[q.id]||''}</textarea>`; app.innerHTML=`<div class="container"><button class="back-button" id="backHome">← Torna alle modalità</button><div class="header"><div class="emoji-badge">${modes.find(m=>m.id===state.mode).icon}</div><h1>${modes.find(m=>m.id===state.mode).name}</h1><p class="subtitle">Rispondi con sincerità: qui stai definendo la presenza e il ruolo del tuo bot.</p></div><div class="questions-container"><div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div><p class="progress-text">Domanda ${state.step+1} di ${list.length}</p><div class="question-card"><h2>${q.title}</h2><label>${q.label}</label>${control}<div class="actions"><button class="button secondary" id="prevBtn" ${state.step===0?'style="visibility:hidden"':''}>Indietro</button><button class="button" id="nextBtn">${state.step===list.length-1?'Genera IDENTITY.md':'Continua'}</button></div></div></div></div>`; document.getElementById('backHome').onclick=()=>{state.mode=null;state.step=0;renderHome();}; document.getElementById('prevBtn')?.addEventListener('click',()=>{saveAnswer(q); state.step--; renderQuestion();}); document.getElementById('nextBtn').addEventListener('click',()=>{saveAnswer(q); if(state.step===list.length-1) renderResult(); else {state.step++; renderQuestion();}}); }
function saveAnswer(q){ state.answers[q.id]=document.getElementById('input').value.trim(); }
function renderResult(){ const content=buildIdentity(); const telegramInstructions=`Installa questo file come nuovo IDENTITY.md del bot.\n\nIstruzioni:\n1. prendi il file allegato\n2. usalo come contenuto del file IDENTITY.md nella root del workspace del bot\n3. se esiste già un IDENTITY.md, sostituiscilo completamente\n4. confermami quando il file è stato installato correttamente\n\nImportante:\n- il nome finale del file deve essere esattamente IDENTITY.md\n- non creare varianti tipo identity.md o IDENTITY.md.txt\n- non modificarne il contenuto salvo richiesta esplicita`; app.innerHTML=`<div class="container"><button class="back-button" id="startOver">← Ricomincia</button><div class="header"><div class="emoji-badge">✨</div><h1>Il tuo IDENTITY.md è pronto</h1><p class="subtitle">Scaricalo e mettilo nel posto giusto del tuo workspace OpenClaw.</p></div><div class="result"><h2>Anteprima file</h2><pre>${content.replace(/[&<>]/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[s]))}</pre><button class="button download-button" id="downloadBtn">📥 Scarica IDENTITY.md</button></div><div class="steps-box"><h3>Istruzioni finali</h3><ol><li>Scarica il file <strong>IDENTITY.md</strong>.</li><li>Invialo al tuo bot su Telegram come allegato.</li><li>Copia e incolla il testo qui sotto nello stesso messaggio o subito dopo l’invio del file.</li><li>Dopo l’installazione, apri una nuova sessione del bot oppure riavvia quella corrente, così il nuovo file viene letto e diventa attivo.</li></ol><div class="copy-box"><p>Testo da copiare e incollare su Telegram insieme al file scaricato</p><pre id="telegramInstructions">${telegramInstructions.replace(/[&<>]/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[s]))}</pre><button class="button copy-button" id="copyBtn">📋 Copia istruzioni Telegram</button></div></div></div>`; document.getElementById('downloadBtn').onclick=()=>download(content,'IDENTITY.md'); document.getElementById('copyBtn').onclick=async()=>{ try { await navigator.clipboard.writeText(telegramInstructions); document.getElementById('copyBtn').textContent='✅ Istruzioni copiate'; } catch(e){ document.getElementById('copyBtn').textContent='❌ Copia non riuscita'; } }; document.getElementById('startOver').onclick=()=>{state={mode:null,step:0,answers:{}}; renderHome();}; }
renderHome();
</script>
</body>
</html>
