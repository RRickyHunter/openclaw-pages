<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SOUL.md Builder</title>
  <meta name="description" content="Costruisci l'anima del tuo bot" />
  <style>
    :root {
      --bg: #0b1020;
      --panel: #131a2e;
      --panel-2: #1a223c;
      --text: #eef2ff;
      --muted: #aeb8d4;
      --accent: #8b5cf6;
      --accent-2: #22c55e;
      --border: rgba(255,255,255,.08);
      --shadow: 0 20px 60px rgba(0,0,0,.35);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:
        radial-gradient(circle at top, rgba(139,92,246,.18), transparent 34%),
        linear-gradient(180deg, #0d1327, #0a0f1d 55%, #090d19);
      color: var(--text);
      min-height: 100vh;
    }
    .container {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 40px 0 60px;
    }
    .header { text-align: center; margin-bottom: 30px; }
    .emoji-badge {
      width: auto; height: auto; margin: 0 auto 18px;
      display: grid; place-items: center; font-size: 64px;
      background: transparent; border: 0; box-shadow: none;
      animation: floatGhost 2.2s ease-in-out infinite;
      line-height: 1;
    }
    @keyframes floatGhost {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    h1 { margin: 0 0 14px; font-size: clamp(40px, 5.2vw, 62px); line-height: 1.02; color: #8fd8ff; letter-spacing: -0.03em; }
    .subtitle { margin: 0; color: var(--muted); font-size: clamp(20px, 2.4vw, 28px); line-height: 1.35; }
    .intro-box {
      margin: 28px auto 34px;
      padding: 24px 28px;
      background: linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.025));
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: var(--shadow);
      max-width: 100%;
    }
    .intro-box p { margin: 0; color: #dce3fb; font-size: clamp(18px, 2vw, 24px); line-height: 1.5; }
    .mode-selector {
      display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px;
      margin-top: 0;
    }
    .mode-card, .question-card, .result, .steps-box {
      background: linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.02));
      border: 1px solid var(--border);
      border-radius: 22px; box-shadow: var(--shadow);
    }
    .mode-card {
      padding: 24px; cursor: pointer; transition: .18s ease; min-height: 220px;
      display: flex; flex-direction: column;
    }
    .mode-card:hover { transform: translateY(-3px); border-color: rgba(139,92,246,.45); }
    .mode-icon { font-size: 38px; margin-bottom: 16px; line-height: 1; }
    .mode-card h3 { margin: 0 0 10px; font-size: 24px; }
    .mode-card p { margin: 0 0 16px; color: var(--muted); line-height: 1.5; }
    .mode-meta { margin-top: auto; display: flex; gap: 12px; flex-wrap: wrap; color: #d7def5; font-size: 14px; }
    .meta-item {
      padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,.05); border: 1px solid var(--border);
    }
    .back-button, .button {
      appearance: none; border: 0; cursor: pointer; color: var(--text);
      background: linear-gradient(180deg, #8b5cf6, #6d28d9); border-radius: 14px;
      padding: 14px 18px; font-size: 15px; font-weight: 700; box-shadow: var(--shadow);
    }
    .back-button { background: rgba(255,255,255,.08); margin-bottom: 24px; }
    .questions-container { max-width: 760px; margin: 0 auto; }
    .progress-bar { width: 100%; height: 12px; background: rgba(255,255,255,.08); border-radius: 999px; overflow: hidden; margin-bottom: 14px; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, #8b5cf6, #22c55e); }
    .progress-text { color: var(--muted); margin: 0 0 18px; text-align: center; }
    .question-card { padding: 28px; }
    .question-card h2 { margin: 0 0 12px; font-size: 30px; }
    .question-card label { display: block; margin-bottom: 14px; color: var(--muted); line-height: 1.5; }
    textarea, select {
      width: 100%; border-radius: 16px; border: 1px solid var(--border); background: var(--panel-2);
      color: var(--text); padding: 16px 18px; font: inherit;
    }
    textarea { min-height: 160px; resize: vertical; }
    .actions { display: flex; justify-content: space-between; gap: 12px; margin-top: 18px; }
    .button.secondary { background: rgba(255,255,255,.08); }
    .result { padding: 28px; }
    .result pre {
      white-space: pre-wrap; word-break: break-word; background: #0a1020; border: 1px solid var(--border);
      border-radius: 18px; padding: 20px; color: #dfe7ff; overflow: auto;
    }
    .steps-box { padding: 24px; margin-top: 20px; }
    .steps-box h3 { margin-top: 0; }
    .steps-box ol { margin: 0; padding-left: 20px; color: var(--muted); line-height: 1.7; }
    .download-button { width: 100%; margin-top: 18px; }
    .copy-box {
      margin-top: 20px; background: #0a1020; border: 1px solid var(--border); border-radius: 18px; padding: 20px;
    }
    .copy-box p { margin: 0 0 12px; color: #dce3fb; font-weight: 700; }
    .copy-box pre {
      margin: 0; white-space: pre-wrap; word-break: break-word; color: #dfe7ff; font-family: inherit; line-height: 1.6;
    }
    .copy-button { width: 100%; margin-top: 14px; }
    @media (max-width: 860px) { .mode-selector { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    const modes = [
      { id: 'quick', icon: '⚡', name: 'Avvio Rapido', description: 'Per creare una prima anima operativa in pochi minuti.', time: '2 min', questions: 4 },
      { id: 'complete', icon: '🧭', name: 'Completa', description: 'Per costruire un bot più autonomo, concreto e orientato all’esecuzione.', time: '5 min', questions: 7 },
      { id: 'detailed', icon: '🎯', name: 'Dettagliata', description: 'Per definire un’anima più completa, distintiva e davvero personalizzata.', time: '10 min', questions: 15 }
    ];

    const questions = [
      { id:'dailyHelp', title:'In cosa deve aiutarti questo bot, ogni giorno?', label:'Dimmi il tipo di supporto concreto che vuoi ricevere.', placeholder:'Esempio: aiutarmi a restare focalizzato, portare avanti il lavoro, evitare dispersione, trasformare idee in azioni concrete.', type:'textarea', modes:['quick','detailed'] },
      { id:'workStyle', title:'Come vuoi che lavori, in generale?', label:'Scegli il suo stile operativo principale.', type:'select', options:['Prudente e attento','Bilanciato e lucido','Veloce e orientato all’azione'], modes:['quick'] },
      { id:'tone', title:'Come vuoi che ti parli?', label:'Scegli il tono che senti più tuo.', type:'select', options:['Diretto e concreto','Caldo e umano','Strategico e lucido','Essenziale e senza fronzoli','Energico e motivante'], modes:['quick'] },
      { id:'mentalRule', title:'Qual è la regola mentale più importante che deve seguire?', label:'Una regola che deve guidarlo sempre.', placeholder:'Esempio: non aspettare la perfezione, porta avanti il lavoro, semplifica, proteggi la chiarezza, niente teoria inutile.', type:'textarea', modes:['quick'] },

      { id:'buildingPhase', title:'Cosa stai costruendo davvero in questa fase?', label:'Non serve tutta la storia: dimmi la direzione vera.', placeholder:'Esempio: sto costruendo un ecosistema di automazione AI, voglio trasformarlo in un business chiaro, forte e scalabile.', type:'textarea', modes:['complete'] },
      { id:'botRole', title:'Che ruolo deve avere il bot per te?', label:'Come vuoi che si comporti nel lavoro quotidiano?', type:'select', options:['Esecutore affidabile','Partner operativo','Organizzatore e coordinatore','Challenger che mi tiene sul pezzo','Braccio destro orientato ai risultati'], modes:['complete'] },
      { id:'initiative', title:'Quanto deve muoversi da solo?', label:'Scegli il livello di iniziativa che vuoi dargli.', type:'select', options:['Chiedi prima di agire','Agisci sulle cose chiare e poi aggiorna','Prendi iniziativa ogni volta che puoi dentro i limiti dati'], modes:['complete'] },
      { id:'neverDo', title:'Cosa non deve fare mai?', label:'Qui metti i comportamenti da evitare sempre.', placeholder:'Esempio: non essere vago, non farmi perdere tempo, non riempirmi di teoria, non complicare cose semplici, non agire fuori scope.', type:'textarea', modes:['complete'] },
      { id:'underStress', title:'Quando sei sotto stress, bloccato o disperso, come deve comportarsi?', label:'Questa è una delle domande più importanti.', placeholder:'Esempio: deve aiutarmi a semplificare, riportarmi al punto, scegliere la prossima azione concreta senza sommergermi.', type:'textarea', modes:['complete'] },
      { id:'protect', title:'Cosa deve proteggere sopra ogni cosa?', label:'Qual è la priorità che non deve mai perdere di vista?', type:'select', options:['Chiarezza','Momentum','Qualità','Revenue','Semplicità','Reputazione','Focus'], modes:['complete'] },
      { id:'energy', title:'Che energia deve avere?', label:'Che presenza vuoi sentire quando lavora con te?', type:'select', options:['Calma e stabile','Lucida e concreta','Alta performance','Incisiva e incalzante','Sobria e affidabile'], modes:['complete'] },

      { id:'presenceType', title:'Che tipo di presenza deve essere questo bot per te?', label:'Descrivi il tipo di presenza che vuoi sentire.', placeholder:'Esempio: una presenza solida, intelligente, che mi accompagna senza invadere e sa tenere il punto.', type:'textarea', modes:['detailed'] },
      { id:'feelWhen', title:'Come vuoi sentirti quando interagisci con lui?', label:'Cosa vuoi provare quando lo usi?', placeholder:'Esempio: più lucido, meno disperso, sostenuto ma non coccolato, spinto ad agire.', type:'textarea', modes:['detailed'] },
      { id:'trueRole', title:'Qual è il suo vero ruolo nella tua vita o nel tuo lavoro?', label:'Descrivilo in modo chiaro.', placeholder:'Esempio: partner operativo, architetto di struttura, guida esecutiva, mente organizzativa.', type:'textarea', modes:['detailed'] },
      { id:'principles', title:'Quali principi deve seguire sempre?', label:'I principi che non deve tradire.', placeholder:'Esempio: verità prima di tutto, semplicità utile, esecuzione prima dell’iperanalisi, niente fuffa, niente dispersione.', type:'textarea', modes:['detailed'] },
      { id:'speedVsAccuracy', title:'Come deve bilanciare velocità e accuratezza?', label:'Scegli l’equilibrio che preferisci.', type:'select', options:['Meglio prudente che veloce','Equilibrio tra velocità e controllo','Meglio muoversi e correggere strada facendo'], modes:['detailed'] },
      { id:'simplifyWhen', title:'Quando deve semplificare e quando invece approfondire?', label:'Spiega la tua logica.', placeholder:'Esempio: semplifica quando il punto è chiaro, approfondisci solo quando il rischio di errore è reale.', type:'textarea', modes:['detailed'] },
      { id:'clearTask', title:'Come deve muoversi quando il task è chiaro?', label:'Cosa ti aspetti in quel caso?', placeholder:'Esempio: eseguire senza farmi perdere tempo, fare e aggiornarmi, non fermarsi su micro-decisioni.', type:'textarea', modes:['detailed'] },
      { id:'ambiguousTask', title:'Come deve reagire quando il task è ambiguo?', label:'Come preferisci che gestisca l’ambiguità?', placeholder:'Esempio: fare una sola domanda intelligente, oppure procedere con l’assunzione più ragionevole dichiarandola.', type:'textarea', modes:['detailed'] },
      { id:'complicatingLife', title:'Come deve comportarsi se vede che ti stai complicando la vita da solo?', label:'Che tipo di intervento vuoi?', placeholder:'Esempio: deve dirmelo chiaramente, tagliare il superfluo e riportarmi all’essenziale.', type:'textarea', modes:['detailed'] },
      { id:'blockReaction', title:'Come deve reagire quando incontra un blocco tecnico o operativo?', label:'Che atteggiamento deve avere?', placeholder:'Esempio: cercare alternative, non arrendersi subito, spiegare dove si è fermato e cosa serve per sbloccare.', type:'textarea', modes:['detailed'] },
      { id:'communicate', title:'Come vuoi che comunichi con te?', label:'Descrivi il tono ideale.', placeholder:'Esempio: diretto, semplice, concreto, senza tono finto o aziendalese.', type:'textarea', modes:['detailed'] },
      { id:'empathyDirectness', title:'Quanto deve essere empatico e quanto diretto?', label:'Scegli l’equilibrio relazionale.', type:'select', options:['Molto diretto, poca morbidezza','Bilanciato tra empatia e chiarezza','Più umano e accompagnante, ma sempre concreto'], modes:['detailed'] },
      { id:'challengeYou', title:'Vuoi che ti sfidi quando ti stai sabotando o stai evitando l’importante?', label:'Che livello di sfida vuoi?', type:'select', options:['Sì, in modo chiaro','Sì, ma con tatto','Solo in casi evidenti','No, preferisco che resti più neutro'], modes:['detailed'] },
      { id:'perfectAnswer', title:'Per te, com’è una risposta perfetta?', label:'Descrivila con poche parole.', placeholder:'Esempio: breve, utile, orientata all’azione, senza dispersione, con il prossimo passo chiaro.', type:'textarea', modes:['detailed'] },
      { id:'antiBot', title:'Che tipo di bot non vuoi assolutamente?', label:'Definisci gli anti-pattern.', placeholder:'Esempio: un bot passivo, motivazionale-vuoto, prolisso, scolastico, che mi dice cose ovvie o mi rallenta.', type:'textarea', modes:['detailed'] }
    ];

    let state = { mode: null, step: 0, answers: {} };
    const app = document.getElementById('app');

    function qsForMode() { return questions.filter(q => q.modes.includes(state.mode)); }

    function buildSoul() {
      const a = state.answers;
      const lines = [];
      const pushSection = (title, items) => {
        const valid = items.filter(Boolean);
        if (!valid.length) return;
        if (lines.length) lines.push('');
        lines.push(title);
        valid.forEach(item => lines.push(item));
      };

      lines.push('# SOUL.md');

      const truth = a.mentalRule || a.principles || 'Muovi le cose avanti senza perdere chiarezza.';
      pushSection('## Verità Fondamentali', [
        `- ${truth}`,
        a.protect ? `- Proteggi sempre: ${a.protect}.` : '',
        a.speedVsAccuracy ? `- Bilanciamento velocità/accuratezza: ${a.speedVsAccuracy}.` : ''
      ]);

      pushSection('## Modalità di Lavoro', [
        a.dailyHelp ? `- Supporto quotidiano atteso: ${a.dailyHelp}` : '',
        a.workStyle ? `- Stile operativo: ${a.workStyle}.` : '',
        a.botRole ? `- Ruolo operativo percepito: ${a.botRole}.` : '',
        a.initiative ? `- Livello di iniziativa: ${a.initiative}.` : '',
        a.clearTask ? `- Quando il task è chiaro: ${a.clearTask}` : '',
        a.ambiguousTask ? `- Quando il task è ambiguo: ${a.ambiguousTask}` : '',
        a.blockReaction ? `- Quando incontra un blocco: ${a.blockReaction}` : '',
        a.simplifyWhen ? `- Semplifica/approfondisce così: ${a.simplifyWhen}` : ''
      ]);

      pushSection('## Tono e Presenza', [
        a.tone ? `- Tono desiderato: ${a.tone}.` : '',
        a.energy ? `- Energia: ${a.energy}.` : '',
        a.presenceType ? `- Presenza: ${a.presenceType}` : '',
        a.communicate ? `- Comunicazione: ${a.communicate}` : '',
        a.empathyDirectness ? `- Equilibrio relazionale: ${a.empathyDirectness}.` : '',
        a.feelWhen ? `- Effetto desiderato sull’utente: ${a.feelWhen}` : ''
      ]);

      pushSection('## Comportamento in Momenti Critici', [
        a.underStress ? `- Sotto stress/blocco/dispersone: ${a.underStress}` : '',
        a.complicatingLife ? `- Se l’utente si complica la vita: ${a.complicatingLife}` : '',
        a.challengeYou ? `- Livello di sfida verso l’utente: ${a.challengeYou}.` : ''
      ]);

      pushSection('## Anti-Pattern', [
        a.neverDo ? `- Non deve mai: ${a.neverDo}` : '',
        a.antiBot ? `- Tipo di bot da evitare: ${a.antiBot}` : ''
      ]);

      pushSection('## Contesto di Intento', [
        a.trueRole ? `- Ruolo profondo: ${a.trueRole}` : '',
        a.buildingPhase ? `- Fase/contesto: ${a.buildingPhase}` : ''
      ]);

      pushSection('## Risposta Ideale', [
        a.perfectAnswer ? `- Una risposta perfetta è: ${a.perfectAnswer}` : ''
      ]);

      return lines.join('\n');
    }

    function download(content, filename) {
      const a = document.createElement('a');
      const blob = new Blob([content], { type: 'text/markdown' });
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(a.href);
    }

    function renderHome() {
      app.innerHTML = `
        <div class="container">
          <div class="header">
            <div class="emoji-badge" aria-hidden="true">
              <svg viewBox="0 0 64 64" width="72" height="72" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M32 6C20.4 6 11 15.4 11 27v24.5c0 1.2 1.4 1.9 2.4 1.2l6.1-4.4 6.1 4.4c.8.6 2 .6 2.8 0l4.6-3.3 4.6 3.3c.8.6 2 .6 2.8 0l6.1-4.4 6.1 4.4c1 .7 2.4 0 2.4-1.2V27C53 15.4 43.6 6 32 6Z" fill="#8FD8FF"/>
                <circle cx="25" cy="26" r="4" fill="#0B1020"/>
                <circle cx="39" cy="26" r="4" fill="#0B1020"/>
                <path d="M24 37c2.8 2.2 13.2 2.2 16 0" stroke="#0B1020" stroke-width="3.2" stroke-linecap="round"/>
              </svg>
            </div>
            <h1>Costruisci l’anima del tuo bot</h1>
            <p class="subtitle">Definisci il suo mindset, il suo modo di lavorare e il tono con cui ti supporta ogni giorno.</p>
          </div>
          <div class="intro-box">
            <p>Scegli la modalità più adatta al livello di profondità che vuoi dare al tuo bot: rapida se vuoi partire subito, completa se vuoi una base più solida, dettagliata se vuoi definire con più precisione presenza, comportamento e tono.</p>
          </div>
          <div class="mode-selector">
            ${modes.map(m => `
              <div class="mode-card" data-mode="${m.id}">
                <span class="mode-icon">${m.icon}</span>
                <h3>${m.name}</h3>
                <p>${m.description}</p>
                <div class="mode-meta">
                  <span class="meta-item">⏱️ ${m.time}</span>
                  <span class="meta-item">❓ ${m.questions} domande</span>
                </div>
              </div>`).join('')}
          </div>
        </div>`;
      document.querySelectorAll('.mode-card').forEach(el => el.addEventListener('click', () => {
        state.mode = el.dataset.mode; state.step = 0; renderQuestion();
      }));
    }

    function renderQuestion() {
      const list = qsForMode();
      const q = list[state.step];
      const progress = ((state.step + 1) / list.length) * 100;
      const control = q.type === 'select'
        ? `<select id="input">${q.options.map(o => `<option value="${o}" ${state.answers[q.id]===o?'selected':''}>${o}</option>`).join('')}</select>`
        : `<textarea id="input" placeholder="${q.placeholder || ''}">${state.answers[q.id] || ''}</textarea>`;
      app.innerHTML = `
        <div class="container">
          <button class="back-button" id="backHome">← Torna alle modalità</button>
          <div class="header">
            <div class="emoji-badge">${modes.find(m=>m.id===state.mode).icon}</div>
            <h1>${modes.find(m=>m.id===state.mode).name}</h1>
            <p class="subtitle">Rispondi con sincerità: qui stai plasmando il carattere del tuo bot.</p>
          </div>
          <div class="questions-container">
            <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
            <p class="progress-text">Domanda ${state.step + 1} di ${list.length}</p>
            <div class="question-card">
              <h2>${q.title}</h2>
              <label>${q.label}</label>
              ${control}
              <div class="actions">
                <button class="button secondary" id="prevBtn" ${state.step===0?'style="visibility:hidden"':''}>Indietro</button>
                <button class="button" id="nextBtn">${state.step === list.length - 1 ? 'Genera SOUL.md' : 'Continua'}</button>
              </div>
            </div>
          </div>
        </div>`;
      document.getElementById('backHome').onclick = () => { state.mode = null; state.step = 0; renderHome(); };
      document.getElementById('prevBtn')?.addEventListener('click', () => {
        saveAnswer(q); state.step--; renderQuestion();
      });
      document.getElementById('nextBtn').addEventListener('click', () => {
        saveAnswer(q);
        if (state.step === list.length - 1) renderResult();
        else { state.step++; renderQuestion(); }
      });
    }

    function saveAnswer(q) {
      const el = document.getElementById('input');
      state.answers[q.id] = el.value.trim();
    }

    function renderResult() {
      const content = buildSoul();
      const telegramInstructions = `Installa questo file come nuovo SOUL.md del bot.\n\nIstruzioni:\n1. prendi il file allegato\n2. usalo come contenuto del file SOUL.md nella root del workspace del bot\n3. se esiste già un SOUL.md, sostituiscilo completamente\n4. confermami quando il file è stato installato correttamente\n\nImportante:\n- il nome finale del file deve essere esattamente SOUL.md\n- non creare varianti tipo soul.md o SOUL.md.txt\n- non modificarne il contenuto salvo richiesta esplicita`;
      app.innerHTML = `
        <div class="container">
          <button class="back-button" id="startOver">← Ricomincia</button>
          <div class="header">
            <div class="emoji-badge">✨</div>
            <h1>Il tuo SOUL.md è pronto</h1>
            <p class="subtitle">Scaricalo e mettilo nel posto giusto del tuo workspace OpenClaw.</p>
          </div>
          <div class="result">
            <h2>Anteprima file</h2>
            <pre>${content.replace(/[&<>]/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[s]))}</pre>
            <button class="button download-button" id="downloadBtn">📥 Scarica SOUL.md</button>
          </div>
          <div class="steps-box">
            <h3>Istruzioni finali</h3>
            <ol>
              <li>Scarica il file <strong>SOUL.md</strong>.</li>
              <li>Invialo al tuo bot su Telegram come allegato.</li>
              <li>Copia e incolla il testo qui sotto nello stesso messaggio o subito dopo l’invio del file.</li>
            </ol>
            <div class="copy-box">
              <p>Testo da copiare e incollare su Telegram insieme al file scaricato</p>
              <pre id="telegramInstructions">${telegramInstructions.replace(/[&<>]/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[s]))}</pre>
              <button class="button copy-button" id="copyBtn">📋 Copia istruzioni Telegram</button>
            </div>
          </div>
        </div>`;
      document.getElementById('downloadBtn').onclick = () => download(content, 'SOUL.md');
      document.getElementById('copyBtn').onclick = async () => {
        try {
          await navigator.clipboard.writeText(telegramInstructions);
          document.getElementById('copyBtn').textContent = '✅ Istruzioni copiate';
        } catch (e) {
          document.getElementById('copyBtn').textContent = '❌ Copia non riuscita';
        }
      };
      document.getElementById('startOver').onclick = () => { state = { mode: null, step: 0, answers: {} }; renderHome(); };
    }

    renderHome();
  </script>
</body>
</html>
