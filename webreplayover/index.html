<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Replay non disponibile | Riccardo Romano</title>
  <meta name="description" content="Il replay del webinar non è più disponibile. Controlla la pagina webinar per vedere quando sarà disponibile il prossimo appuntamento." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #070b14;
      --bg-soft: #0e1525;
      --panel: rgba(15, 23, 42, 0.88);
      --text: #f8fafc;
      --muted: #cbd5e1;
      --muted-2: #94a3b8;
      --accent: #7c3aed;
      --accent-2: #22d3ee;
      --accent-3: #f59e0b;
      --radius-xl: 32px;
      --radius-lg: 24px;
      --shadow: 0 30px 80px rgba(2, 6, 23, 0.6);
      --max: 1160px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      line-height: 1.65;
      background:
        radial-gradient(circle at 15% 15%, rgba(124, 58, 237, 0.32), transparent 28%),
        radial-gradient(circle at 85% 10%, rgba(34, 211, 238, 0.22), transparent 24%),
        radial-gradient(circle at 50% 55%, rgba(245, 158, 11, 0.1), transparent 32%),
        linear-gradient(180deg, #04070f 0%, #090d17 38%, #05070c 100%);
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 34px 34px;
      mask-image: radial-gradient(circle at center, black 45%, transparent 88%);
      opacity: 0.28;
    }
    a { color: inherit; }
    .wrap {
      width: min(var(--max), calc(100% - 24px));
      min-height: 100vh;
      margin: 0 auto;
      padding: 20px 0 48px;
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .hero {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(124, 58, 237, 0.18);
      border-radius: var(--radius-xl);
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.92), rgba(8, 15, 28, 0.9));
      box-shadow: var(--shadow);
      padding: 14px;
    }
    .hero::after {
      content: "";
      position: absolute;
      inset: auto -12% -30% auto;
      width: 380px;
      height: 380px;
      background: radial-gradient(circle, rgba(124, 58, 237, 0.28), transparent 68%);
      filter: blur(12px);
      pointer-events: none;
    }
    .hero-content {
      position: relative;
      padding: 28px 20px 30px;
      border-radius: var(--radius-lg);
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.5), rgba(8, 15, 28, 0.68));
      border: 1px solid rgba(124, 58, 237, 0.16);
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: center;
      align-items: center;
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      border-radius: 999px;
      border: 1px solid rgba(34, 211, 238, 0.22);
      background: rgba(15, 23, 42, 0.72);
      color: #c4b5fd;
      font-weight: 800;
      font-size: 0.76rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      margin-bottom: 18px;
    }
    h1 {
      margin: 0;
      font-size: clamp(2.2rem, 7vw, 4.2rem);
      line-height: 0.98;
      letter-spacing: -0.05em;
      font-weight: 900;
      max-width: 12ch;
    }
    .headline-accent {
      background: linear-gradient(90deg, #ffffff 0%, #c4b5fd 36%, #67e8f9 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .hero-copy {
      margin: 18px 0 0;
      max-width: 680px;
      color: var(--muted);
      font-size: 1.05rem;
    }
    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 26px;
      justify-content: center;
      width: 100%;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 60px;
      padding: 0 24px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 900;
      font-size: 1.05rem;
      line-height: 1.15;
      text-align: center;
      transition: transform .18s ease, box-shadow .18s ease, opacity .18s ease;
      border: 0;
      cursor: pointer;
      width: 100%;
      max-width: 420px;
      color: #08111f;
      background: linear-gradient(135deg, #67e8f9 0%, #a78bfa 42%, #f59e0b 100%);
      box-shadow: 0 18px 45px rgba(124, 58, 237, 0.35);
    }
    .btn:hover { transform: translateY(-2px); }
    .footer {
      margin-top: 24px;
      text-align: center;
      color: var(--muted-2);
      font-size: 0.92rem;
      padding-bottom: 12px;
    }
    .footer-links {
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    .footer-links a {
      text-decoration: none;
      color: #cbd5e1;
    }
    .footer-links a:hover { text-decoration: underline; }
    @media (min-width: 768px) {
      .wrap { width: min(var(--max), calc(100% - 40px)); padding-top: 24px; }
      .hero { padding: 18px; }
      .hero-content { padding: 42px 46px 44px; min-height: 520px; }
      .btn { width: auto; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <div class="hero-content">
        <div class="eyebrow">Replay webinar</div>
        <h1>Mi dispiace, il replay <span class="headline-accent">non è più disponibile.</span></h1>
        <p class="hero-copy">Controlla quando sarà disponibile il nuovo webinar a questa pagina.</p>
        <div class="hero-actions">
          <a class="btn" href="https://riccardoromano.biz/webinar">Vai alla pagina webinar</a>
        </div>
      </div>
    </section>

    <div class="footer">
      <div>© 2026 Riccardo Romano. Tutti i diritti riservati.</div>
      <div class="footer-links">
        <a href="/privacy-policy/">Privacy Policy</a>
        <a href="/termini-di-servizio/">Termini di Servizio</a>
        <a href="/disclaimer-ocae/">Disclaimer</a>
      </div>
    </div>
  </main>
</body>
</html>
